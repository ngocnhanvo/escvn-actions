name: ESC CI Architecture Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: escvn-actions-architecture-check
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Actions Hub
        uses: actions/checkout@v4

      - name: Validate SOURCE_REPO_PAT
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"

      - name: Checkout private Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: private/astro
          persist-credentials: false

      - name: Checkout private PHP source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: private/php
          persist-credentials: false

      - name: Enforce Actions Hub architecture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          verify_path = root / '.github/workflows/verify.yml'
          deploy_path = root / '.github/workflows/deploy.yml'
          provision_path = root / '.github/workflows/provision-webnext.yml'
          preview_path = root / '.github/workflows/tablepress-previews.yml'

          for path in (verify_path, deploy_path, provision_path, preview_path):
              assert path.is_file(), f'Missing Hub workflow: {path}'

          verify = verify_path.read_text(encoding='utf-8')
          deploy = deploy_path.read_text(encoding='utf-8')
          provision = provision_path.read_text(encoding='utf-8')
          preview = preview_path.read_text(encoding='utf-8')

          assert 'repository: ngocnhanvo/escvn-astro' in verify
          assert 'ref: github' in verify
          assert 'SOURCE_REPO_PAT' in verify
          assert 'ENV_FILE' in verify
          assert 'pnpm test:run' in verify
          assert 'pnpm check' in verify
          assert 'pnpm run build-git' in verify

          assert 'repository_dispatch:' in deploy
          assert 'wp_trigger_build' in deploy
          assert 'repository: ngocnhanvo/escvn-astro' in deploy
          assert 'ref: master' in deploy
          assert 'SOURCE_REPO_PAT' in deploy
          assert 'ENV_FILE' in deploy
          assert 'FTP_SERVER' in deploy
          assert 'FTP_USERNAME' in deploy
          assert 'FTP_PASSWORD' in deploy
          assert 'Smoke Test WebNext Production' in deploy
          assert 'requests/deploy-escvn.txt' in deploy
          assert 'push:\n    branches:\n      - master' not in deploy

          assert 'repository: ngocnhanvo/escvn-php' in provision
          assert 'ref: master' in provision
          assert 'SOURCE_REPO_PAT' in provision
          assert 'WP_ADMIN_URL' in provision
          assert 'WP_ADMIN_USERNAME' in provision
          assert 'WP_ADMIN_PASSWORD' in provision

          assert 'automation/tablepress/previews.mjs' in preview
          assert 'TABLEPRESS_PREVIEW_MODE' in preview
          assert 'TABLEPRESS_SHORTCODES' in preview
          assert 'TABLEPRESS_FORCE' in preview
          assert 'tablepress-previews' in preview
          assert Path('private/php/automation/tablepress/previews.mjs').is_file(), 'Missing reusable TablePress preview tool'

          astro_workflows = Path('private/astro/.github/workflows')
          assert not astro_workflows.exists() or not list(astro_workflows.glob('*.yml')), \
              'Private escvn-astro must not contain active GitHub Actions workflows'

          php_workflows = Path('private/php/.github/workflows')
          assert not php_workflows.exists() or not list(php_workflows.glob('*.yml')), \
              'Private escvn-php must not contain active GitHub Actions workflows'

          mu_config = Path('private/php/wp-content/mu-plugins/esc-github-trigger-config.php').read_text(encoding='utf-8')
          expected = "define('VCS_GH_REPO', 'escvn-actions');"
          assert expected in mu_config, 'MU trigger config must dispatch to escvn-actions'

          print('Quota-safe Actions Hub architecture contract passed.')
          PY

      - name: Validate automation syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check private/php/automation/webnext/provision.mjs
          node --check private/php/automation/tablepress/previews.mjs

      - name: Validate ESC regional bank transfer module
        shell: bash
        run: |
          set -euo pipefail
          php -l private/php/wp-content/mu-plugins/esc-bacs-regions.php
          php -l private/php/wp-content/themes/vibe-code-theme/inc/checkout/checkout_endpoint.php
          node --check private/php/wp-content/mu-plugins/esc-bacs-regions-admin.js
          python - <<'PY'
          from pathlib import Path
          module = Path('private/php/wp-content/mu-plugins/esc-bacs-regions.php').read_text()
          checkout = Path('private/php/wp-content/themes/vibe-code-theme/inc/checkout/checkout_endpoint.php').read_text()
          done = Path('private/astro/src/astro/pages/CheckoutDonePage.astro').read_text()
          assert 'esc_bacs_account_for_city' in module
          assert 'woocommerce_bacs_accounts' in module
          assert checkout.index('esc_bacs_account_for_city') < checkout.index('wc_create_order()')
          assert '_esc_bacs_payment_account' in checkout
          assert 'esc_bacs_payment_account' in done
          assert 'payment_gateways/bacs' not in done
          print('Regional BACS to order snapshot and VietQR contract passed.')
          PY
