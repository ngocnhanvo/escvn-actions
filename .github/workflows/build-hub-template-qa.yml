name: ESC Private Build Hub Template QA (No Deploy)
on:
  push:
    branches: [main]
    paths:
      - 'build-hub-template/**'
      - '.github/workflows/build-hub-template-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  template_qa:
    name: Verify persistent dependencies and secret/deploy boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout template only (public, never secret values)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check persistent deps and tests
        run: |
          node --check build-hub-template/scripts/persistent-deps.mjs
          node --check build-hub-template/tests/persistent-deps.test.mjs
      - name: Exercise persistent dependencies twice without pnpm or live secrets
        run: node build-hub-template/tests/persistent-deps.test.mjs
      - name: Parse Windows PowerShell and private workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File build-hub-template/tests/validate-powershell.ps1
          ruby -e 'require "yaml"; YAML.parse_file("build-hub-template/.github/workflows/vps-build.yml"); puts "Private Hub YAML syntax PASS"'
      - name: Package private Build Hub bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          zip -r -q esc-build-hub-bootstrap.zip build-hub-template/
          unzip -t esc-build-hub-bootstrap.zip | tail -1
          test -s esc-build-hub-bootstrap.zip
      - name: Publish bootstrap ZIP without credentials
        uses: actions/upload-artifact@v4
        with:
          name: esc-build-hub-bootstrap
          path: esc-build-hub-bootstrap.zip
          if-no-files-found: error
          retention-days: 7

      - name: Verify private template cannot deploy over FTP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('build-hub-template')
          workflow=(root/'.github/workflows/vps-build.yml').read_text()
          worker=(root/'scripts/run-project-build.ps1').read_text()
          assert 'workflow_dispatch:' in workflow
          assert 'runs-on: [self-hosted, Windows, X64, esc-build-worker]' in workflow
          assert 'secrets.ENV_FILE_ESC' in workflow and 'secrets.ENV_FILE_ANHSANG' in workflow
          if 'repository_dispatch:' in workflow:
            assert 'types: [esc-build-request, anhsang-build-request]' in workflow, 'Wrong Hub event types'
          assert 'concurrency:' in workflow
          assert 'pnpm run build-git' in worker
          for bad in ('FTP_PASSWORD','FTP_SERVER','lftp','ftp://','scp ', 'wp_trigger_build'):
            assert bad.lower() not in (workflow+worker).lower(), f'Deploy forbidden in private build-only template: {bad}'
          print('Build Hub template safety contract PASSED')
          PY
