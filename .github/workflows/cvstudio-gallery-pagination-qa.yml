name: ESC CV Gallery Pagination Live QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/cvstudio-gallery-pagination-qa.txt']
permissions:
  contents: read
concurrency:
  group: esc-cv-gallery-pagination-live-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser test
        run: node --check scripts/cvstudio-gallery-pagination-qa.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate WordPress paging and live Astro gallery
        run: node scripts/cvstudio-gallery-pagination-qa.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cv-gallery-pagination-error
          path: cv-gallery-pagination-error.png
          if-no-files-found: ignore
          retention-days: 3
