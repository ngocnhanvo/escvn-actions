name: ESC CV PDF Preview and Export Production Browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/cvstudio-pdf-preview-export-qa.txt']
permissions:
  contents: read
concurrency:
  group: escvn-cvstudio-pdf-preview-export-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium and PNG verifier
        run: |
          node --check scripts/cvstudio-pdf-preview-export-qa.mjs
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Test real PDF plugin and PDF/PNG export
        run: node scripts/cvstudio-pdf-preview-export-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvstudio-pdf-browser-proof
          path: |
            cv-pdf-preview-qa.png
            cv-pdf-export-qa-failure.png
          retention-days: 3
          if-no-files-found: ignore
