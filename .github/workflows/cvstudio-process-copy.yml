name: Update ESC CV Process Copy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/cvstudio-process-copy.txt']
permissions:
  contents: read
concurrency:
  group: escvn-cvstudio-process-copy
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - name: Verify source revision and WordPress target
        id: source
        shell: bash
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          for key in WP_ADMIN_URL WP_ADMIN_USERNAME WP_ADMIN_PASSWORD SOURCE_REPO_PAT; do
            test -n "${!key}"
          done
          sha="$(sed -n 's/^source_sha=//p' control/requests/cvstudio-process-copy.txt | tail -1 | tr -d '\r')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          url=os.environ['WP_ADMIN_URL']
          parsed=urlsplit(url if '://' in url else 'https://'+url)
          if parsed.hostname != 'admin.esc.vn':
              raise SystemExit('Refusing non-ESC WordPress destination')
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout ESC backend source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          path: source
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
      - name: Validate exact backend commit and syntax
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check source/automation/cvstudio/update-process-copy.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        working-directory: source
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Update only existing CV Studio ESC Table rows
        working-directory: source
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node automation/cvstudio/update-process-copy.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cvstudio-process-copy-failure
          path: source/cvstudio-process-copy-failure.png
          retention-days: 3
          if-no-files-found: ignore
