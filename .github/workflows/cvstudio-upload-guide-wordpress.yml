name: ESC CV Guide Specification WordPress
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/cvstudio-upload-guide-wordpress.txt']
permissions:
  contents: read
concurrency:
  group: esc-cv-upload-guide-wp
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check controlled WordPress task syntax
        run: |
          node --check scripts/cvstudio-guide-v2-wordpress.mjs
          grep -Fq "admin.esc.vn" scripts/cvstudio-guide-v2-wordpress.mjs
          grep -Fq "postId=55473" scripts/cvstudio-guide-v2-wordpress.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Update existing ESC CV v1 guide and attach verified sample ZIP
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/cvstudio-guide-v2-wordpress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvstudio-guide-v2-content-backup
          path: |
            cvstudio-guide-v2-error.png
            /tmp/cv-guide-before-update.html
          if-no-files-found: ignore
          retention-days: 3
