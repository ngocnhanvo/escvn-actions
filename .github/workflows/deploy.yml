name: Deploy ESC Astro Production

on:
  repository_dispatch:
    types: [wp_trigger_build]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/deploy-escvn.txt'

concurrency:
  group: escvn-actions-deploy-escvn
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$ENV_FILE"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Checkout private ESC Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Show production source revision
        working-directory: source
        run: echo "Deploying escvn-astro@master $(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Make .env
        working-directory: source
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Restore and update Astro cache
        uses: actions/cache@v4
        with:
          path: source/.cache
          key: ${{ runner.os }}-escvn-dot-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-escvn-dot-cache-

      - name: Build Project
        working-directory: source
        env:
          cachePage: "false"
          cacheTablePress: "false"
        run: pnpm run build-git

      - name: Validate WebNext TablePress build data
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const dataPath = 'dist/client/data/page-thiet-ke-website-headless-wordpress-astro.json';
          const htmlPath = 'dist/client/thiet-ke-website-headless-wordpress-astro/index.html';
          const expected = Array.from({ length: 6 }, (_, index) => `webnext_0${index}`);

          const page = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
          const blocks = Array.isArray(page.contents) ? page.contents : [];
          console.log('WordPress content:', String(page.content || '').replace(/\s+/g, ' ').trim());
          console.log('TablePress blocks:', blocks
            .filter((block) => block?.type === 'shortcode')
            .map((block) => ({
              shortcode: block.shortcode,
              items: Array.isArray(block?.data?.items) ? block.data.items.length : null,
            })));

          const html = fs.readFileSync(htmlPath, 'utf8');
          const missing = expected.filter((id) => !html.includes(`data-tablepress-preview="${id}"`));
          if (missing.length) {
            console.error('Missing WebNext TablePress frontend sections:', missing.join(', '));
            process.exit(1);
          }
          console.log('Verified WebNext TablePress frontend sections:', expected.join(', '));
          NODE

      - name: Zip Build Folder
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy upload
          cp .env deploy/
          cp -r dist/* deploy/
          cd deploy
          zip -r ../upload/escvn.zip .
          cd ..
          rm -rf dist deploy

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./source/upload/
          server-dir: /domains/esc.vn/public_html/
          timeout: 600000
          security: "loose"
          dangerous-clean-slate: false

      - name: Trigger Remote Unzip
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .env
          curl -fsS "$WC_URL/unzip.php"

      - name: Smoke Test WebNext Production
        shell: bash
        run: |
          set -euo pipefail
          url="https://esc.vn/thiet-ke-website-headless-wordpress-astro/"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          for attempt in {1..12}; do
            status="$(curl -L -sS -o "$body_file" -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 "$url" || true)"

            if [ "$status" = "200" ] \
              && grep -Fq "ESC WebNext" "$body_file" \
              && grep -Fq "WordPress Headless" "$body_file" \
              && grep -Fq "Astro" "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_00"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_01"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_02"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_03"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_04"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_05"' "$body_file" \
              && grep -Fq "NHẬN TƯ VẤN" "$body_file"; then
              echo "WebNext production smoke test passed (HTTP 200)."
              exit 0
            fi

            echo "Attempt ${attempt}/12 failed (HTTP ${status:-curl-error}); waiting for production to settle..."
            sleep 5
          done

          echo "::error::WebNext production smoke test failed after 12 attempts."
          exit 1
