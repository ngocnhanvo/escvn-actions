name: Deploy ESC Astro Production

on:
  repository_dispatch:
    types: [wp_trigger_build]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/deploy-escvn.txt'

concurrency:
  group: escvn-actions-deploy-escvn
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$ENV_FILE"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Checkout private ESC Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Show production source revision
        working-directory: source
        run: echo "Deploying escvn-astro@master $(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Make .env
        working-directory: source
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Restore and update Astro cache
        uses: actions/cache@v4
        with:
          path: source/.cache
          key: ${{ runner.os }}-escvn-dot-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-escvn-dot-cache-

      - name: Build Project
        working-directory: source
        env:
          cachePage: "false"
          cacheTablePress: "false"
        run: pnpm run build-git

      - name: Validate WebNext TablePress build data
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const page = JSON.parse(fs.readFileSync(
            'dist/client/data/page-thiet-ke-website-headless-wordpress-astro.json',
            'utf8',
          ));
          const html = fs.readFileSync(
            'dist/client/thiet-ke-website-headless-wordpress-astro/index.html',
            'utf8',
          );
          const expectedCounts = {
            webnext_00: 8,
            webnext_01: 6,
            webnext_02: 7,
            webnext_03: 2,
            webnext_04: 8,
            webnext_05: 1,
            webnext_06: 2,
          };

          const blocks = new Map(
            (Array.isArray(page.contents) ? page.contents : [])
              .filter((block) => block?.type === 'shortcode' && block?.shortcode)
              .map((block) => [String(block.shortcode).toLowerCase(), block]),
          );

          for (const [id, expectedCount] of Object.entries(expectedCounts)) {
            const block = blocks.get(id);
            const count = Array.isArray(block?.data?.items) ? block.data.items.length : -1;
            if (count !== expectedCount) {
              throw new Error(`${id}: expected ${expectedCount} item(s), got ${count}.`);
            }
            if (!html.includes(`data-tablepress-preview="${id}"`)) {
              throw new Error(`${id}: frontend preview marker is missing from generated HTML.`);
            }
          }

          const sourceContent = String(page.content || '').toLowerCase();
          const widgetPosition = sourceContent.indexOf('[table id=webnext_06 /]');
          const firstLegacySection = sourceContent.indexOf('[table id=webnext_01 /]');
          if (widgetPosition < 0 || firstLegacySection < 0 || widgetPosition > firstLegacySection) {
            throw new Error('WebNext widget must be the first ESC Table shortcode after Hero.');
          }

          console.log('Verified WebNext TablePress data and frontend markers.');
          NODE

      - name: Validate WebNext Spotlight Build Output
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const page = JSON.parse(fs.readFileSync('dist/client/data/page-default.json', 'utf8'));
          const html = fs.readFileSync('dist/client/index.html', 'utf8');
          const shortcodes = [...String(page.content || '').matchAll(/\[table\s+id=([\w-]+)\s*\/\]/g)]
            .map((m) => m[1]);
          const idx = shortcodes.indexOf('home_01');
          const items = (page.contents || []).filter((part) => part?.shortcode === 'home_06');
          const rows = Array.isArray(items[0]?.data?.items) ? items[0].data.items.length : 0;

          console.log('Home page:', { id: page.id, key: page.key, shortcodes, home06_rows: rows });
          if (idx < 0 || shortcodes[idx + 1] !== 'home_06') {
            throw new Error('Missing home_06 immediately after home_01 in the newly built homepage JSON.');
          }
          if (items.length !== 1 || rows !== 11) {
            throw new Error('WordPress home_06 TablePress data missing/incomplete from new Astro build.');
          }
          if (!html.includes('data-tablepress-preview="home_06"') ||
              !html.includes('id="esc-webnext-home-heading"') ||
              !html.includes('/thiet-ke-website-headless-wordpress-astro/#webnext-audit')) {
            throw new Error('New Astro homepage HTML is missing WebNext spotlight or CTA.');
          }
          console.log('WebNext homepage build contract passed.');
          NODE

      - name: Zip Build Folder
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy upload
          cp .env deploy/
          cp -r dist/* deploy/
          cd deploy
          zip -r ../upload/escvn.zip .
          cd ..
          rm -rf dist deploy

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./source/upload/
          server-dir: /domains/esc.vn/public_html/
          timeout: 600000
          security: "loose"
          dangerous-clean-slate: false

      - name: Trigger Remote Unzip
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .env
          curl -fsS "$WC_URL/unzip.php"

      - name: Smoke Test WebNext Production
        shell: bash
        run: |
          set -euo pipefail
          url="https://esc.vn/thiet-ke-website-headless-wordpress-astro/"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          for attempt in {1..12}; do
            status="$(curl -L -sS -o "$body_file" -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 "$url" || true)"

            if [ "$status" = "200" ] \
              && grep -Fq "ESC WebNext" "$body_file" \
              && grep -Fq "WordPress Headless" "$body_file" \
              && grep -Fq "Astro" "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_00"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_01"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_02"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_03"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_04"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_05"' "$body_file" \
              && grep -Fq 'data-tablepress-preview="webnext_06"' "$body_file" \
              && grep -Fq "NHẬN TƯ VẤN" "$body_file"; then
              echo "WebNext production smoke test passed (HTTP 200)."
              exit 0
            fi

            echo "Attempt ${attempt}/12 failed (HTTP ${status:-curl-error}); waiting for production to settle..."
            sleep 5
          done

          echo "::error::WebNext production smoke test failed after 12 attempts."
          exit 1

      - name: Smoke Test WebNext Spotlight on Homepage
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          for attempt in {1..12}; do
            status="$(curl -L -sS -o "$body_file" -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 'https://esc.vn/' || true)"
            if [ "$status" = "200" ] \
              && grep -Fq 'data-tablepress-preview="home_06"' "$body_file" \
              && grep -Fq 'id="esc-webnext-home-heading"' "$body_file" \
              && grep -Fq '/thiet-ke-website-headless-wordpress-astro/#webnext-audit' "$body_file"; then
              echo "ESC WebNext homepage spotlight smoke test passed."
              exit 0
            fi
            echo "Homepage WebNext check attempt $attempt/12: HTTP ${status:-error}"
            sleep 5
          done
          echo "::error::WebNext spotlight is missing from the production homepage."
          exit 1
