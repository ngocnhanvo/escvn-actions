name: Deploy ESC Astro Production

on:
  repository_dispatch:
    types: [wp_trigger_build]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/deploy-escvn.txt'

concurrency:
  group: escvn-actions-deploy-escvn
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$ENV_FILE"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Checkout private ESC Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Show production source revision
        working-directory: source
        run: echo "Deploying escvn-astro@master $(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Make .env
        working-directory: source
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Restore and update Astro cache
        uses: actions/cache@v4
        with:
          path: source/.cache
          key: ${{ runner.os }}-escvn-dot-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-escvn-dot-cache-

      - name: Build Project
        working-directory: source
        env:
          cachePage: "false"
          cacheTablePress: "false"
        run: pnpm run build-git

      - name: Validate WebNext TablePress build data
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const page = JSON.parse(fs.readFileSync(
            'dist/client/data/page-thiet-ke-website-headless-wordpress-astro.json',
            'utf8',
          ));
          const html = fs.readFileSync(
            'dist/client/thiet-ke-website-headless-wordpress-astro/index.html',
            'utf8',
          );
          const expectedCounts = {
            webnext_00: 8,
            webnext_01: 6,
            webnext_02: 7,
            webnext_03: 2,
            webnext_04: 8,
            webnext_05: 1,
            webnext_06: 2,
          };

          const blocks = new Map(
            (Array.isArray(page.contents) ? page.contents : [])
              .filter((block) => block?.type === 'shortcode' && block?.shortcode)
              .map((block) => [String(block.shortcode).toLowerCase(), block]),
          );

          for (const [id, expectedCount] of Object.entries(expectedCounts)) {
            const block = blocks.get(id);
            const count = Array.isArray(block?.data?.items) ? block.data.items.length : -1;
            if (count !== expectedCount) {
              throw new Error(`${id}: expected ${expectedCount} item(s), got ${count}.`);
            }
            if (!html.includes(`data-tablepress-preview="${id}"`)) {
              throw new Error(`${id}: frontend preview marker is missing from generated HTML.`);
            }
          }

          const sourceContent = String(page.content || '').toLowerCase();
          const widgetPosition = sourceContent.indexOf('[table id=webnext_06 /]');
          const firstLegacySection = sourceContent.indexOf('[table id=webnext_01 /]');
          if (widgetPosition < 0 || firstLegacySection < 0 || widgetPosition > firstLegacySection) {
            throw new Error('WebNext widget must be the first ESC Table shortcode after Hero.');
          }

          console.log('Verified WebNext TablePress data and frontend markers.');
          NODE

      - name: Validate WebNext Spotlight Build Output
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const page = JSON.parse(fs.readFileSync('dist/client/data/page-default.json', 'utf8'));
          const html = fs.readFileSync('dist/client/index.html', 'utf8');
          const shortcodes = [...String(page.content || '').matchAll(/\[table\s+id=([\w-]+)\s*\/\]/g)]
            .map((m) => m[1]);
          const idx = shortcodes.indexOf('home_01');
          const items = (page.contents || []).filter((part) => part?.shortcode === 'home_06');
          const rows = Array.isArray(items[0]?.data?.items) ? items[0].data.items.length : 0;

          const shortcodeIds = (text) => [...String(text || '').matchAll(/\[table\s+id=([\w-]+)\s*\/\]/g)].map(m=>m[1]);
          if (fs.existsSync('.cache/pages.json')) {
            const raw=JSON.parse(fs.readFileSync('.cache/pages.json','utf8'));
            const row=raw.find(x=>x?.id===248);
            console.log('Build raw WordPress page 248 shortcodes:', shortcodeIds(row?.content?.rendered));
          }
          if (fs.existsSync('.cache/data.json')) {
            const data=JSON.parse(fs.readFileSync('.cache/data.json','utf8'));
            const row=data.pages?.find(x=>x?.id===248 && x.slug==='');
            console.log('Build processed home shortcodes:', shortcodeIds(row?.content));
          }
          if (fs.existsSync('.cache/tablepress.json')) {
            const tables=JSON.parse(fs.readFileSync('.cache/tablepress.json','utf8'));
            console.log('Build raw TablePress has home_06:', Array.isArray(tables) && tables.some(t=>String(t?.id)==='home_06'));
          }
          console.log('Home page:', { id: page.id, key: page.key, shortcodes, home06_rows: rows });
          if (idx < 0 || shortcodes[idx + 1] !== 'home_06') {
            throw new Error('Missing home_06 immediately after home_01 in the newly built homepage JSON.');
          }
          const records = Array.isArray(items[0]?.data?.items) ? items[0].data.items : [];
          const requiredKeys = [
            'badge','title','description','feature_1','feature_2','feature_3',
            'primary_text','primary_url','secondary_text','secondary_url','disclaimer',
            'report_aria_label','report_eyebrow','report_title','report_subtitle',
            'report_metric_1_title','report_metric_1_description',
            'report_metric_2_title','report_metric_2_description',
            'report_metric_3_title','report_metric_3_description','report_download_text'
          ];
          const config = new Map();
          for (const item of records) {
            if (!item || typeof item.key !== 'string' || config.has(item.key)) {
              throw new Error('home_06 contains missing or duplicate keys.');
            }
            config.set(item.key, typeof item.value === 'string' ? item.value.trim() : '');
          }
          const missing = requiredKeys.filter(key => !config.get(key));
          if (items.length !== 1 || missing.length || rows < requiredKeys.length) {
            throw new Error('WordPress home_06 ESC Table missing required content keys: ' + missing.join(','));
          }
          if (!html.includes('data-tablepress-preview="home_06"') ||
              !html.includes('id="esc-webnext-home-heading"') ||
              !html.includes('/thiet-ke-website-headless-wordpress-astro/#webnext-audit')) {
            throw new Error('New Astro homepage HTML is missing WebNext spotlight or CTA.');
          }
          console.log('WebNext homepage build contract passed.');
          NODE

      - name: Zip Build Folder
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy upload
          cp .env deploy/
          cp -r dist/* deploy/
          cd deploy
          zip -r ../upload/escvn.zip .
          cd ..
          rm -rf dist deploy

      - name: Install reliable FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Upload ESC production ZIP with resume and byte verification
        working-directory: source
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          protocol="${FTP_PROTOCOL:-ftp}"
          case "$protocol" in ftp|ftps|sftp) ;; *) echo '::error::Invalid FTP_PROTOCOL'; exit 1;; esac
          endpoint="$protocol://$FTP_SERVER"
          remote_dir="/domains/esc.vn/public_html"
          local_zip="$PWD/upload/escvn.zip"
          test -s "$local_zip"
          sha="$(sha256sum "$local_zip" | cut -d' ' -f1)"
          # The content hash makes retries resumable without ever mixing two builds.
          stage=".escvn-stage-${sha:0:32}.zip"
          echo "Transferring archive with resumable FTP (SHA256: ${sha:0:16}...)."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 12
          set net:timeout 45
          set net:reconnect-interval-base 5
          set ssl:verify-certificate no
          cd "$remote_dir"
          put -c "$local_zip" -o "$stage"
          get -c "$stage" -o /tmp/escvn-deploy-roundtrip.zip
          bye
          LFTP
          cmp "$local_zip" /tmp/escvn-deploy-roundtrip.zip
          echo "FTP round-trip byte verification succeeded."
          # Only after full byte verification may the archive used by unzip.php change.
          # Web files are untouched until the separate unzip step.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 5
          set net:timeout 45
          set ssl:verify-certificate no
          cd "$remote_dir"
          rm -f escvn.zip
          mv "$stage" escvn.zip
          bye
          LFTP
          echo "ESC release ZIP staged and activated for remote extraction."


      - name: Trigger Remote Unzip
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          source .env
          curl -fsS "$WC_URL/unzip.php"
