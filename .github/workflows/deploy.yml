name: Deploy ESC Astro Production

on:
  repository_dispatch:
    types: [wp_trigger_build]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/deploy-escvn.txt'

concurrency:
  group: escvn-actions-deploy-escvn
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENV_FILE: ${{ secrets.ENV_FILE }}
      SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ESC_FTPS_CA_PEM: ${{ secrets.ESC_FTPS_CA_PEM }}
      ASTRO_FTP_TARGET: /domains/esc.vn/public_html/
      ZIP_PATH: source/upload/escvn.zip

    steps:
      - name: Checkout ESC production deployment scripts
        uses: actions/checkout@v4
        with:
          path: actions-hub
          persist-credentials: false
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$ENV_FILE"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Checkout private ESC Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Show production source revision
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(git symbolic-ref --short HEAD)" = master
          echo "ESC_DEPLOY_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "Build source SHA: $sha (master)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify signed PHP staging and FTPS TLS before build
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -m py_compile actions-hub/scripts/esc-signed-unzip.py actions-hub/scripts/esc-ftps-upload.py actions-hub/scripts/esc-runtime-env-ftps.py actions-hub/scripts/esc-delta-package.py
          python3 -m unittest discover -s actions-hub/tests -p test_esc_delta_package.py
          python3 actions-hub/scripts/esc-signed-unzip.py check
          python3 actions-hub/scripts/esc-ftps-upload.py probe

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install frozen dependencies (pnpm store cache)
        working-directory: source
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          start=$SECONDS
          pnpm install --frozen-lockfile --prefer-offline
          echo "- Dependency installation: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Make private build-time .env (never copied into ZIP)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$ENV_FILE" > .env

      - name: Restore and update Astro cache
        uses: actions/cache@v4
        with:
          path: source/.cache
          key: ${{ runner.os }}-escvn-dot-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-escvn-dot-cache-

      - name: Build Astro production (preserve existing WordPress refresh policy)
        working-directory: source
        shell: bash
        timeout-minutes: 18
        env:
          cachePage: "false"
          cacheTablePress: "false"
        run: |
          set -euo pipefail
          start=$SECONDS
          pnpm run build-git
          echo "- Astro build: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate WebNext TablePress build data
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const page = JSON.parse(fs.readFileSync(
            'dist/client/data/page-thiet-ke-website-headless-wordpress-astro.json',
            'utf8',
          ));
          const html = fs.readFileSync(
            'dist/client/thiet-ke-website-headless-wordpress-astro/index.html',
            'utf8',
          );
          const expectedCounts = {
            webnext_00: 8,
            webnext_01: 6,
            webnext_02: 7,
            webnext_03: 2,
            webnext_04: 8,
            webnext_05: 1,
            webnext_06: 2,
          };

          const blocks = new Map(
            (Array.isArray(page.contents) ? page.contents : [])
              .filter((block) => block?.type === 'shortcode' && block?.shortcode)
              .map((block) => [String(block.shortcode).toLowerCase(), block]),
          );

          for (const [id, expectedCount] of Object.entries(expectedCounts)) {
            const block = blocks.get(id);
            const count = Array.isArray(block?.data?.items) ? block.data.items.length : -1;
            if (count !== expectedCount) {
              throw new Error(`${id}: expected ${expectedCount} item(s), got ${count}.`);
            }
            if (!html.includes(`data-tablepress-preview="${id}"`)) {
              throw new Error(`${id}: frontend preview marker is missing from generated HTML.`);
            }
          }

          const sourceContent = String(page.content || '').toLowerCase();
          const widgetPosition = sourceContent.indexOf('[table id=webnext_06 /]');
          const firstLegacySection = sourceContent.indexOf('[table id=webnext_01 /]');
          if (widgetPosition < 0 || firstLegacySection < 0 || widgetPosition > firstLegacySection) {
            throw new Error('WebNext widget must be the first ESC Table shortcode after Hero.');
          }

          console.log('Verified WebNext TablePress data and frontend markers.');
          NODE

      - name: Validate WebNext Spotlight Build Output
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const page = JSON.parse(fs.readFileSync('dist/client/data/page-default.json', 'utf8'));
          const html = fs.readFileSync('dist/client/index.html', 'utf8');
          const shortcodes = [...String(page.content || '').matchAll(/\[table\s+id=([\w-]+)\s*\/\]/g)]
            .map((m) => m[1]);
          const idx = shortcodes.indexOf('home_01');
          const items = (page.contents || []).filter((part) => part?.shortcode === 'home_06');
          const rows = Array.isArray(items[0]?.data?.items) ? items[0].data.items.length : 0;

          const shortcodeIds = (text) => [...String(text || '').matchAll(/\[table\s+id=([\w-]+)\s*\/\]/g)].map(m=>m[1]);
          if (fs.existsSync('.cache/pages.json')) {
            const raw=JSON.parse(fs.readFileSync('.cache/pages.json','utf8'));
            const row=raw.find(x=>x?.id===248);
            console.log('Build raw WordPress page 248 shortcodes:', shortcodeIds(row?.content?.rendered));
          }
          if (fs.existsSync('.cache/data.json')) {
            const data=JSON.parse(fs.readFileSync('.cache/data.json','utf8'));
            const row=data.pages?.find(x=>x?.id===248 && x.slug==='');
            console.log('Build processed home shortcodes:', shortcodeIds(row?.content));
          }
          if (fs.existsSync('.cache/tablepress.json')) {
            const tables=JSON.parse(fs.readFileSync('.cache/tablepress.json','utf8'));
            console.log('Build raw TablePress has home_06:', Array.isArray(tables) && tables.some(t=>String(t?.id)==='home_06'));
          }
          console.log('Home page:', { id: page.id, key: page.key, shortcodes, home06_rows: rows });
          if (idx < 0 || shortcodes[idx + 1] !== 'home_06') {
            throw new Error('Missing home_06 immediately after home_01 in the newly built homepage JSON.');
          }
          const records = Array.isArray(items[0]?.data?.items) ? items[0].data.items : [];
          const requiredKeys = [
            'badge','title','description','feature_1','feature_2','feature_3',
            'primary_text','primary_url','secondary_text','secondary_url','disclaimer',
            'report_aria_label','report_eyebrow','report_title','report_subtitle',
            'report_metric_1_title','report_metric_1_description',
            'report_metric_2_title','report_metric_2_description',
            'report_metric_3_title','report_metric_3_description','report_download_text'
          ];
          const config = new Map();
          for (const item of records) {
            if (!item || typeof item.key !== 'string' || config.has(item.key)) {
              throw new Error('home_06 contains missing or duplicate keys.');
            }
            config.set(item.key, typeof item.value === 'string' ? item.value.trim() : '');
          }
          const missing = requiredKeys.filter(key => !config.get(key));
          if (items.length !== 1 || missing.length || rows < requiredKeys.length) {
            throw new Error('WordPress home_06 ESC Table missing required content keys: ' + missing.join(','));
          }
          if (!html.includes('data-tablepress-preview="home_06"') ||
              !html.includes('id="esc-webnext-home-heading"') ||
              !html.includes('/thiet-ke-website-headless-wordpress-astro/#webnext-audit')) {
            throw new Error('New Astro homepage HTML is missing WebNext spotlight or CTA.');
          }
          console.log('WebNext homepage build contract passed.');
          NODE

      - name: Validate compiled SSR before packaging
        working-directory: source
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node --check dist/server/entry.mjs
          test -s dist/server/entry.mjs
          test -s dist/client/index.html
          echo "- Verified SSR entry and client index for escvn-astro/master: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Package signed Astro release (no public runtime secrets)
        working-directory: source
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          start=$SECONDS
          mkdir -p deploy upload
          cp -a dist/. deploy/
          # Signed PHP inventory is checked before any compiled bytes are omitted.
          # PHP restores and checks SHA-256 on the staging tree before activation.
          python3 ../actions-hub/scripts/esc-delta-package.py deploy
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=os.environ['ESC_DEPLOY_COMMIT']
          if not re.fullmatch(r'[0-9a-f]{40}',sha):
              raise RuntimeError('Missing immutable Astro production SHA')
          Path('deploy/esc-release.json').write_text(json.dumps({
              'branch':'master','commit':sha,'target':'esc.vn'},sort_keys=True))
          PY
          (cd deploy && zip -q -6 -r ../upload/escvn.zip .)
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          archive=Path('upload/escvn.zip')
          with ZipFile(archive) as bundle:
              names=set(bundle.namelist())
              if any(Path(n.rstrip('/')).name in ('.env','.htpasswd') or n.startswith('private-runtime') for n in names):
                  raise RuntimeError('Secret or credential file in release archive')
              for required in ('server/entry.mjs','client/index.html','esc-release.json'):
                  if required not in names:
                      raise RuntimeError('Missing verified production artifact '+required)
              if bundle.testzip() is not None:
                  raise RuntimeError('Corrupt deployment archive')
              if json.loads(bundle.read('esc-release.json')) != {
                  'branch':'master','commit':__import__('os').environ['ESC_DEPLOY_COMMIT'],'target':'esc.vn'}:
                  raise RuntimeError('Source SHA or target mismatch in ZIP')
          print('ESC_RELEASE_ZIP_BYTES='+str(archive.stat().st_size))
          PY
          echo "- Signed ZIP (deflate 6): $(stat -c %s upload/escvn.zip) bytes in $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
          rm -rf deploy

      - name: Deploy protected runtime env via verified FTPS (not in ZIP)
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          start=$SECONDS
          python3 actions-hub/scripts/esc-runtime-env-ftps.py
          echo "- Verified protected runtime env: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZIP via Python FTPS with authenticated TLS
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          start=$SECONDS
          python3 actions-hub/scripts/esc-ftps-upload.py upload
          echo "- Python FTPS upload: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Activate signed Astro bundle using PHP staging and rollback
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          start=$SECONDS
          python3 actions-hub/scripts/esc-signed-unzip.py unpack
          echo "- Signed PHP activation: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
          echo 'BUILD_SUCCESS=PASS (compiled SSR, WordPress data, ZIP and SHA marker verified)' >> "$GITHUB_STEP_SUMMARY"
          echo 'DEPLOY_READY=PASS (HMAC signed PHP staging, checksum and rollback contract verified)' >> "$GITHUB_STEP_SUMMARY"
          echo "QA_PASS=NOT_CHECKED (run production smoke workflow separately)" >> "$GITHUB_STEP_SUMMARY"
