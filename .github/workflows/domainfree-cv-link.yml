name: Update ESC DomainFree CV Offer Link
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/domainfree-cv-link.txt']
permissions:
  contents: read
concurrency:
  group: escvn-domainfree-cv-link
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub
          persist-credentials: false
      - name: Verify target and exact source
        id: source
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          for key in WP_ADMIN_URL WP_ADMIN_USERNAME WP_ADMIN_PASSWORD SOURCE_REPO_PAT; do test -n "${!key}"; done
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          assert urlparse(os.environ['WP_ADMIN_URL']).hostname == 'admin.esc.vn'
          PY
          sha="$(sed -n 's/^source_sha=//p' hub/requests/domainfree-cv-link.txt | tail -1 | tr -d '\r')"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Confirm script syntax and PHP source
        env:
          EXPECTED: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          node --check source/automation/domainfree/update-cv-link.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        working-directory: source
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Change only existing ESC Table note hyperlink
        working-directory: source
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node automation/domainfree/update-cv-link.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: domainfree-cv-link-failure
          path: source/domainfree-cv-link-failure.png
          if-no-files-found: ignore
          retention-days: 3
