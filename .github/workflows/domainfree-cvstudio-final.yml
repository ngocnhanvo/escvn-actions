name: Move Domain Free CV Studio to Bottom
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/domainfree-cvstudio-final.txt']
permissions:
  contents: read
concurrency:
  group: escvn-domainfree-cvstudio-position
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: hub
          persist-credentials: false
      - name: Validate target and source revision
        id: verify
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          for key in WP_ADMIN_URL WP_ADMIN_USERNAME WP_ADMIN_PASSWORD SOURCE_REPO_PAT; do test -n "${!key}"; done
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          assert urlparse(os.environ['WP_ADMIN_URL']).hostname == 'admin.esc.vn', 'Wrong target'
          PY
          sha="$(sed -n 's/^source_sha=//p' hub/requests/domainfree-cvstudio-final.txt | tail -1 | tr -d '\r')"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Verify script syntax and commit
        env:
          EXPECTED_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          node --check source/automation/domainfree/move-cvstudio-end.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        working-directory: source
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Move shortcode using ESC Table picker and clear WordPress badge
        working-directory: source
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node automation/domainfree/move-cvstudio-end.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: domainfree-cvstudio-final-failure
          path: source/domainfree-final-failure.png
          if-no-files-found: ignore
          retention-days: 3
