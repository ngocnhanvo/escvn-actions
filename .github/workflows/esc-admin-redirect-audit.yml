name: ESC Admin Redirect Read-Only Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/esc-admin-redirect-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Probe public redirect chain without login, edits, or credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, statistics
          from urllib.parse import urlsplit
          BASE = 'https://admin.esc.vn'
          PATHS = ['/', '/admin', '/wp-admin/', '/wp-login.php', '/wp-json/', '/?rest_route=%2F']
          print('Read-only ESC WordPress HTTP redirects; 3 independent GETs; no cookies/login; no redirects followed')
          for path in PATHS:
              samples=[]
              for i in range(3):
                  cmd=['curl','--silent','--show-error','--max-time','25',
                       '--connect-timeout','12','--http1.1','--request','GET',
                       '--output','/dev/null','--dump-header','-',
                       '--write-out','\nESC_META:%{http_code}|%{time_total}|%{url_effective}\n',
                       BASE+path]
                  result=subprocess.run(cmd,capture_output=True,text=True,timeout=30)
                  if result.returncode:
                      samples.append({'error':result.stderr.strip()[:130]}); continue
                  raw=result.stdout
                  meta=raw.split('ESC_META:')[-1].strip().split('|')
                  headers={}
                  for line in raw.split('ESC_META:')[0].splitlines():
                      if ':' in line:
                          key,val=line.split(':',1)
                          if key.lower() in ('location','x-redirect-by','server','cache-control','x-cache'):
                              headers[key.lower()]=val.strip()
                  samples.append({'http':meta[0],'time_s':round(float(meta[1]),3),
                                  'location':headers.get('location',''),
                                  'redirect_by':headers.get('x-redirect-by',''),
                                  'server':headers.get('server','')})
              times=[x['time_s'] for x in samples if 'time_s' in x]
              codes=list(sorted({s.get('http','ERROR') for s in samples}))
              print(json.dumps({'path':path,'codes':codes,
                     'avg_s':round(statistics.mean(times),3) if times else None,
                     'samples':samples},ensure_ascii=False))
          PY
