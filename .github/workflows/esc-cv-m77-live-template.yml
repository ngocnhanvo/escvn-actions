name: ESC CV M77 Template Update (Only M77)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/esc-cv-m77-live-template.txt'
permissions:
  contents: read
concurrency:
  group: esc-cv-m77-live-update
  cancel-in-progress: false
jobs:
  m77:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requests and HTML parser
        run: pip install --disable-pip-version-check requests==2.32.3 beautifulsoup4==4.13.3
      - name: Validate read-only or publish mode request
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'template=M77' requests/esc-cv-m77-live-template.txt
          grep -Eq '^mode=(probe|publish)$' requests/esc-cv-m77-live-template.txt
          python -m py_compile scripts/esc_cv_m77_wp.py
      - name: Read current M77 ZIP and prepare next immutable version
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mode=$(sed -n 's/^mode=//p' requests/esc-cv-m77-live-template.txt | tail -1)
          if [ "$mode" = "probe" ]; then
            M77_MODE=probe python scripts/esc_cv_m77_wp.py
          else
            M77_MODE=prepare python scripts/esc_cv_m77_wp.py
          fi
      - name: Setup browser preview dependencies for M77 publish
        if: ${{ contains(github.event.head_commit.message, 'M77') || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Re-render M77 preview using original demo data
        if: ${{ hashFiles('qa-m77-source/next-version.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/esc_cv_m77_preview.mjs
          npm install --no-save playwright@1.55.0 handlebars@4.7.8 sharp@0.34.3
          npx playwright install --with-deps chromium
          node scripts/esc_cv_m77_preview.mjs
      - name: Publish M77 new version and activate via official WordPress admin actions
        if: ${{ hashFiles('qa-m77-source/next-version.txt') != '' }}
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: M77_MODE=publish python scripts/esc_cv_m77_wp.py
      - name: Verify published M77 appearance directly on esc.vn
        if: ${{ hashFiles('qa-m77-source/next-version.txt') != '' }}
        run: |
          set -euo pipefail
          node --check scripts/esc_cv_m77_live_verify.mjs
          node scripts/esc_cv_m77_live_verify.mjs
      - name: Archive source snapshot for rollback
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m77-original-source-${{ github.run_id }}
          path: qa-m77-source/
          retention-days: 14
          if-no-files-found: ignore
