name: ESC Member Cart Astro DEV QA (NO DEPLOY)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/esc-member-cart-dev-qa.yml']
permissions:
  contents: read
concurrency:
  group: esc-member-cart-dev-qa
  cancel-in-progress: true
jobs:
  qa:
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 30
    env:
      EXPECTED_SHA: 6c0038b1a7c42c09d51d8e2793f7af52699851b6
      PUBLIC_MEMBER_CART_ENABLED: 'true'
      PUBLIC_MEMBER_CART_BASE: https://id.esc.vn
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source
      - name: Verify exactly the reviewed development commit
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          # actions/checkout can check out an exact ref in detached HEAD mode; SHA above is authoritative.
          echo "SOURCE_SHA=$EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "ENV=Member TEST; no FTP, no production deploy" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Configure read-only WordPress data for build
        working-directory: source
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          test -n "$ENV_FILE"
          printf '%s\n' "$ENV_FILE" > .env
          echo 'PUBLIC_MEMBER_CART_ENABLED=true' >> .env
          echo 'PUBLIC_MEMBER_CART_BASE=https://id.esc.vn' >> .env
      - name: Test Member cart API contract with mocked browser fetch
        working-directory: source
        run: pnpm exec vitest run src/lib/memberCart/client.test.ts src/lib/memberCart/registerNow.test.ts scripts/inject-handler.member-cart-csp.test.ts scripts/componentsJS/header-layout.test.ts
      - name: Build Astro DEV with Member TEST mode enabled
        working-directory: source
        run: pnpm run build-git
      - name: Browser QA - add a mapped pricing CTA to a mocked Member cart (no real writes)
        working-directory: source
        env:
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: '4321'
        run: |
          set -euo pipefail
          npm install --prefix /tmp/esc-playwright --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
          node dist/server/entry.mjs >/tmp/esc-dev-server.log 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          for n in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4321/google-workspace >/dev/null; then break; fi
            if ! kill -0 "$srv" 2>/dev/null; then cat /tmp/esc-dev-server.log; exit 1; fi
            sleep 2
          done
          cat >/tmp/esc-dev-cta-qa.mjs <<'JS'
          import {chromium} from '/tmp/esc-playwright/node_modules/playwright/index.mjs';
          const base='http://127.0.0.1:4321',key='a'.repeat(64);
          const browser=await chromium.launch({headless:true});
          const results=[],writes=[];
          const record=(name,ok,extra={})=>{results.push({name,pass:!!ok,...extra});if(!ok)throw Error(name)};
          try{
            const page=await browser.newPage({viewport:{width:1920,height:900}});
            await page.route(/^https:\/\/id\.esc\.vn\/api\/cart\//,async route=>{
              const url=route.request().url(),pathname=new URL(url).pathname;
              let body={ok:true};
              if(pathname.endsWith('/add.php')){
                const params=new URLSearchParams(route.request().postData()||'');
                writes.push(Object.fromEntries(params));
                body={ok:true,cart:key,count:0,cart_url:'https://id.esc.vn/cart.php?c='+key};
              }else if(pathname.endsWith('/view.php')){
                body={ok:true,status:'open',count:0,items:[],addons:writes.map(w=>({type:w.type,product_id:Number(w.product_id),name:'QA service',total:10000})),total:10000};
              }else if(pathname.endsWith('/count.php'))body={ok:true,status:'open',count:0};
              else if(pathname.endsWith('/status.php'))body={ok:true,cart_status:'open',order:null};
              else body={ok:false,error:'NO_REAL_WRITES'};
              await route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':base},body:JSON.stringify(body)});
            });
            const response=await page.goto(base+'/google-workspace',{waitUntil:'domcontentloaded',timeout:30000});
            record('GOOGLE_PAGE',response?.status()===200);
            const cards=await page.locator('[data-esc-buy-now]').evaluateAll(els=>els.map(x=>({memberId:x.getAttribute('data-esc-member-id'),type:x.getAttribute('data-esc-member-type')})));
            record('GOOGLE_CTA_PRESENT',cards.length>=3,{count:cards.length});
            const target=page.locator('a[data-esc-buy-now][data-esc-member-type]:not([data-esc-member-id=""])').first();
            record('MAPPED_PRODUCT_AVAILABLE',(await target.count())>0);
            const id=await target.getAttribute('data-esc-member-id'),type=await target.getAttribute('data-esc-member-type');
            const initialPage=page.url();
            await target.click();
            await page.locator('[data-esc-buy-status]').first().waitFor({state:'visible',timeout:12000});
            record('STAYS_ON_PRICING_PAGE',page.url()===initialPage);
            record('SHOWS_ADDED_TO_CART',/Đã thêm vào giỏ/.test(await page.locator('[data-esc-buy-status]').first().textContent()||''));
            record('MEMBER_POST_ONCE',writes.length===1);
            record('MEMBER_PRODUCT_ID_CORRECT',writes[0]?.product_id===id&&writes[0]?.type===type);
            record('NO_ORDER_CREATED',writes.every(x=>!('price' in x)&&!('checkout' in x)));
            const headerCart=page.locator('.js-cart-navigation').first();
            const expectedCart='https://id.esc.vn/cart.php?c='+key;
            await page.waitForFunction(url=>document.querySelector('.js-cart-navigation')?.getAttribute('href')===url,expectedCart,{timeout:10000});
            record('HEADER_CART_LINKS_MEMBER_CHECKOUT',(await headerCart.getAttribute('href'))===expectedCart);
            await page.waitForFunction(()=>document.querySelector('.js-cart-navigation .js-cart-badge')?.textContent?.trim()==='1',{timeout:10000});
            record('HEADER_BADGE_ONE', (await page.locator('.js-cart-navigation .js-cart-badge').first().textContent())?.trim()==='1');
            await page.route(/^https:\/\/id\.esc\.vn\/cart\.php\?c=/,route=>route.fulfill({
              status:200,contentType:'text/html',body:'<!doctype html><title>Member checkout intercepted (QA)</title>'
            }));
            await Promise.all([
              page.waitForURL(url=>url.origin==='https://id.esc.vn'&&url.pathname==='/cart.php'&&url.searchParams.get('c')===key,{timeout:15000}),
              headerCart.click(),
            ]);
            record('CART_ICON_OPENS_MEMBER_CHECKOUT',page.url()===expectedCart);

            // Missing ACF mapping must not navigate or create a Member cart entry.
            await page.goto(base+'/google-workspace',{waitUntil:'domcontentloaded'});
            const missing=page.locator('a[data-esc-buy-now]').first();
            await missing.evaluate(el=>el.setAttribute('data-esc-member-id',''));
            const writeBaseline=writes.length;
            await missing.click();
            await page.locator('[data-esc-buy-error]').first().waitFor({state:'visible',timeout:10000});
            record('MISSING_ID_BLOCKS_WRITE',writes.length===writeBaseline&&page.url().includes('/google-workspace'));
            // The Member service add API has no term parameter; don't silently sell 24-month UI as 12.
            await missing.evaluate(el=>{
              el.setAttribute('data-esc-member-id','131600');
              const b=document.createElement('button');b.dataset.cycleBtn='24';b.className='active';
              el.closest('section')?.prepend(b);
            });
            await missing.click();
            const termError=await page.locator('[data-esc-buy-error]').first().textContent();
            record('UNSUPPORTED_TERM_BLOCKS_WRITE',writes.length===writeBaseline&&/24 tháng/.test(termError||''));

            const memberAccount='https://id.esc.vn/member/baogia.php';
            await page.route(memberAccount,route=>route.fulfill({
              status:200,contentType:'text/html',body:'<!doctype html><title>Member account intercepted (QA)</title>'
            }));
            const history=page.getByRole('link',{name:'Lịch sử đơn hàng',exact:true});
            record('HEADER_ORDER_STATUS_REMOVED',await page.locator('.js-member-order-status').count()===0);
            record('DESKTOP_MEMBER_HISTORY_VISIBLE',await history.isVisible()&&await history.innerText()==='Lịch sử đơn hàng');
            for(const width of [1920,1536,1535,1440,1280,1279,1188,1100,1024,835,768,390,320]){
              await page.setViewportSize({width,height:900});
              const nav=page.locator('#desktop-menu'),hamburger=page.locator('#hamburger-btn');
              record('HEADER_HISTORY_VISIBLE_'+width,await history.isVisible());
              record('HEADER_HISTORY_LABEL_'+width,(await history.innerText()).trim()===(width>=1536?'Lịch sử đơn hàng':''));
              await page.waitForFunction(()=>!!document.getElementById('header-container')?.dataset.navMode);
              await page.evaluate(()=>document.fonts.ready);
              await page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
              const layout=await page.locator('#header-container').evaluate(el=>{
                const css=getComputedStyle(el),actions=el.querySelector('[data-header-actions]'),logo=el.querySelector('[data-header-logo]'),nav=el.querySelector('#desktop-menu'),hamburger=el.querySelector('#hamburger-btn');
                const gap=parseFloat(getComputedStyle(actions).columnGap)||0;
                const visible=[...actions.children].filter(x=>x!==hamburger&&getComputedStyle(x).display!=='none');
                const available=el.clientWidth-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight);
                const needed=logo.getBoundingClientRect().width+nav.getBoundingClientRect().width+visible.reduce((sum,x)=>sum+x.getBoundingClientRect().width,0)+Math.max(0,visible.length-1)*gap+24;
                return {available,needed,mode:el.dataset.navMode};
              });
              const desktop=Math.ceil(layout.needed)<=Math.floor(layout.available);
              record('HEADER_NAV_MODE_'+width,(await nav.isVisible())===desktop&&(await hamburger.isVisible())===!desktop,layout);
              if(width===1188)record('TABLET_1188_FULL_NAV',desktop,layout);
              if(!desktop){
                const geometry=await page.locator('[data-header-actions]').evaluate(el=>{
                  const nodes=[el.querySelector('.js-cart-navigation'),el.querySelector('a[href$="/member/baogia.php"]'),el.querySelector('#hamburger-btn')];
                  return nodes.map(n=>{const b=n.getBoundingClientRect();return {x:b.x,y:b.y,w:b.width,h:b.height};});
                });
                record('COMPACT_ICONS_ALIGNED_'+width,geometry.every(x=>Math.abs(x.w-geometry[0].w)<1&&Math.abs(x.h-geometry[0].h)<1&&Math.abs(x.y-geometry[0].y)<1)&&Math.abs((geometry[1].x-geometry[0].x-geometry[0].w)-(geometry[2].x-geometry[1].x-geometry[1].w))<1,geometry);
              }
              const bounds=await page.locator('#header-container').evaluate(el=>{
                const rect=el.getBoundingClientRect(),visible=[...el.querySelectorAll('a,button')].filter(x=>x.getClientRects().length&&getComputedStyle(x).visibility==='visible');
                return {width:innerWidth,left:Math.min(...visible.map(x=>x.getBoundingClientRect().left)),right:Math.max(...visible.map(x=>x.getBoundingClientRect().right)),headerRight:rect.right};
              });
              record('HEADER_NO_OVERFLOW_'+width,bounds.left>=-1&&bounds.right<=bounds.width+1&&bounds.headerRight<=bounds.width+1,bounds);
            }
            await page.setViewportSize({width:835,height:760});
            const hamburger=page.locator('#hamburger-btn');
            await hamburger.click();
            record('TABLET_MENU_OPENS',await hamburger.getAttribute('aria-expanded')==='true');
            await page.setViewportSize({width:1920,height:900});
            await page.waitForFunction(()=>document.getElementById('hamburger-btn')?.getAttribute('aria-expanded')==='false');
            await page.setViewportSize({width:390,height:844});
            record('MOBILE_MENU_REMAINS_CLOSED',await hamburger.getAttribute('aria-expanded')==='false');
            await hamburger.click();
            await page.keyboard.press('Escape');
            record('MOBILE_ESCAPE_CLOSES',await hamburger.getAttribute('aria-expanded')==='false');
            record('MOBILE_MEMBER_HISTORY_VISIBLE',await history.isVisible());
            record('MEMBER_HISTORY_LINK',await history.getAttribute('href')===memberAccount);
            await Promise.all([page.waitForURL(memberAccount),history.click()]);

          }finally{await browser.close()}
          console.log('CTA_BROWSER_QA',JSON.stringify({results,mockMemberWrites:writes.length,realMemberWrites:0,ordersCreated:0}));
          JS
          node /tmp/esc-dev-cta-qa.mjs
      - name: Check built feature references and source boundary
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/client
          test -d dist/server
          grep -Rq 'id.esc.vn' dist/client/ dist/server/
          grep -Rq 'member-cart-panel' dist/client/ dist/server/
          test ! -e .git/refs/heads/master
          echo 'MEMBER_TEST_BUILD_PASS; no FTP upload or CMS order created' >> "$GITHUB_STEP_SUMMARY"
