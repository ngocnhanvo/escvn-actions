name: Provision Home WebNext ESC Table

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/home-webnext-provision.txt']

concurrency:
  group: escvn-actions-home-webnext-provision
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout provision request
        uses: actions/checkout@v4
        with:
          path: hub
      - name: Parse expected backend revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ -f hub/requests/home-webnext-provision.txt ]; then
            sha="$(sed -n 's/^source_sha=//p' hub/requests/home-webnext-provision.txt | tail -n 1 | tr -d '\r')"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate credentials
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$WP_ADMIN_URL"
          test -n "$WP_ADMIN_USERNAME"
          test -n "$WP_ADMIN_PASSWORD"
      - name: Checkout PHP automation source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Verify provision source and syntax
        working-directory: source
        env:
          REQUEST_SHA: ${{ steps.request.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$REQUEST_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$REQUEST_SHA"
          fi
          node --check automation/home-webnext/provision.mjs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        working-directory: source
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Provision home_06 and place after home_01
        working-directory: source
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node automation/home-webnext/provision.mjs
      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: home-webnext-provision-failure
          path: source/home-webnext-provision-failure.png
          if-no-files-found: ignore
          retention-days: 3
