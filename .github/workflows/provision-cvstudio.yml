name: Provision ESC CV Studio WordPress
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/provision-cvstudio.txt']
permissions:
  contents: read
concurrency:
  group: escvn-cvstudio-wordpress-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout provision request
        uses: actions/checkout@v4
        with:
          path: control
      - name: Validate exact backend SHA and WP target
        shell: bash
        id: expected
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          for k in SOURCE_REPO_PAT WP_ADMIN_URL WP_ADMIN_USERNAME WP_ADMIN_PASSWORD; do test -n "${!k}"; done
          sha="$(sed -n 's/^source_sha=//p' control/requests/provision-cvstudio.txt | tail -1 | tr -d '\r')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          value=os.environ['WP_ADMIN_URL']
          u=urlsplit(value if '://' in value else 'https://'+value)
          if u.hostname != 'admin.esc.vn': raise SystemExit('Wrong target; refusing to provision')
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout backend source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Verify immutable source, syntax and target
        shell: bash
        env:
          EXPECTED: ${{ steps.expected.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED"
          node --check source/automation/cvstudio/provision.mjs
          grep -Fq "tablepress_open_shortcode_thickbox" source/automation/cvstudio/provision.mjs
          grep -Fq "verifyEditorPreview" source/automation/cvstudio/provision.mjs
          ! grep -E "textarea\.fill\(['\x22]\[table " source/automation/cvstudio/provision.mjs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright chromium
        working-directory: source
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Provision Page and three ESC Tables using official editor picker
        working-directory: source
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node automation/cvstudio/provision.mjs
      - name: Upload screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cvstudio-wordpress-provision-failure
          path: source/cvstudio-provision-failure.png
          retention-days: 3
          if-no-files-found: ignore
