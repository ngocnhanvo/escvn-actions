name: Update ESC Table Preview Images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'missing = only tables without preview; single/selected = chosen shortcode IDs'
        required: true
        default: missing
        type: choice
        options:
          - missing
          - single
          - selected
      shortcodes:
        description: 'Comma/newline separated ESC Table IDs, e.g. webnext_01,webnext_03'
        required: false
        default: ''
        type: string
      force:
        description: 'Replace an existing preview image'
        required: false
        default: false
        type: boolean
      page_url:
        description: 'Optional production page URL override for the selected IDs'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - 'requests/tablepress-previews.txt'

concurrency:
  group: escvn-actions-tablepress-previews
  cancel-in-progress: false

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$WP_ADMIN_URL"
          test -n "$WP_ADMIN_USERNAME"
          test -n "$WP_ADMIN_PASSWORD"

      - name: Checkout preview request
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          path: hub
          persist-credentials: false

      - name: Checkout private ESC PHP source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Resolve preview request
        id: preview_request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
          INPUT_SHORTCODES: ${{ github.event_name == 'workflow_dispatch' && inputs.shortcodes || '' }}
          INPUT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
          INPUT_PAGE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.page_url || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            mode="$INPUT_MODE"
            shortcodes="$INPUT_SHORTCODES"
            force="$INPUT_FORCE"
            page_url="$INPUT_PAGE_URL"
          else
            request_file='hub/requests/tablepress-previews.txt'
            test -f "$request_file"

            value() {
              local key="$1"
              sed -nE "s/^[[:space:]]*${key}[[:space:]]*:[[:space:]]*(.*)$/\1/Ip" "$request_file" | tail -n 1
            }

            mode="$(value mode)"
            shortcodes="$(value shortcodes)"
            force="$(value force)"
            page_url="$(value page_url)"
          fi

          mode="${mode:-missing}"
          force="${force:-false}"

          case "$mode" in
            missing|single|selected) ;;
            *) echo "::error::Unsupported preview mode: $mode"; exit 1 ;;
          esac
          case "${force,,}" in
            true|false|1|0|yes|no|on|off) ;;
            *) echo "::error::Unsupported force value: $force"; exit 1 ;;
          esac
          if [ "$mode" = 'single' ] && [[ "$shortcodes" == *,* ]]; then
            echo '::error::single mode accepts exactly one shortcode.'
            exit 1
          fi
          if [ "$mode" != 'missing' ] && [ -z "$shortcodes" ]; then
            echo "::error::$mode mode requires shortcodes."
            exit 1
          fi

          {
            echo "mode=$mode"
            echo "shortcodes=$shortcodes"
            echo "force=$force"
            echo "page_url=$page_url"
          } >> "$GITHUB_OUTPUT"

          printf 'Preview request: mode=%s force=%s shortcodes=%s page_url=%s\n' \
            "$mode" "$force" "${shortcodes:-<auto>}" "${page_url:-<all>}"

      - name: Check preview automation syntax
        working-directory: source
        run: node --check automation/tablepress/previews.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser and image tools
        working-directory: source
        run: |
          npm install --no-save playwright@1.55.0 sharp@0.34.3
          npx playwright install --with-deps chromium

      - name: Capture and publish ESC Table previews
        working-directory: source
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          TABLEPRESS_PUBLIC_ORIGIN: https://esc.vn
          TABLEPRESS_PREVIEW_MODE: ${{ steps.preview_request.outputs.mode }}
          TABLEPRESS_SHORTCODES: ${{ steps.preview_request.outputs.shortcodes }}
          TABLEPRESS_FORCE: ${{ steps.preview_request.outputs.force }}
          TABLEPRESS_PAGE_URL: ${{ steps.preview_request.outputs.page_url }}
        run: node automation/tablepress/previews.mjs

      - name: Upload preview diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tablepress-previews
          path: source/tablepress-previews/
          if-no-files-found: ignore
          retention-days: 3
