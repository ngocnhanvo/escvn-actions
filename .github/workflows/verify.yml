name: Verify ESC Astro Development

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/verify-escvn.txt'

concurrency:
  group: escvn-actions-verify-escvn
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$ENV_FILE"

      - name: Checkout private ESC Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Checkout ESC WordPress backend for isolated PHP lint
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: backend
          persist-credentials: false

      - name: Verify ESC PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -v | head -n 1
          for path in \
            backend/wp-content/mu-plugins/esc-seo-files.php \
            backend/wp-content/mu-plugins/esc-marketing-settings.php \
            backend/wp-content/mu-plugins/esc-multilingual-delete-sync.php \
            backend/wp-content/mu-plugins/esc-multilingual-admin.php \
            backend/wp-content/plugins/esc-visual-builder/esc-visual-builder.php \
            backend/wp-content/plugins/esc-visual-builder/includes/key-value-seed.php \
            backend/wp-content/plugins/esc-visual-builder/includes/site-config.php \
            backend/wp-content/plugins/esc-visual-builder/includes/text-editor.php \
            backend/wp-content/plugins/esc-visual-builder/includes/text-editor-ui.php \
            backend/wp-content/plugins/esc-visual-builder/tests/key-value-content.php \
            backend/wp-content/plugins/esc-visual-builder/includes/item-manager.php \
            backend/wp-content/plugins/esc-visual-builder/includes/section-order.php \
            backend/wp-content/plugins/esc-visual-builder/includes/item-section-ui.php \
            backend/wp-content/plugins/esc-visual-builder/includes/page-image.php \
            backend/wp-content/plugins/esc-visual-builder/includes/image-editor.php \
            backend/wp-content/plugins/esc-table/views/view-edit.php \
            backend/unzip-v2.php; do
            php -l "$path"
          done
          php backend/wp-content/plugins/esc-visual-builder/tests/key-value-content.php

      - name: Show source revision
        working-directory: source
        run: echo "Verifying escvn-astro@github $(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Make .env
        working-directory: source
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Run unit tests
        working-directory: source
        run: pnpm test:run

      - name: Run Astro check and capture inherited diagnostics
        working-directory: source
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee astro-check.log
          echo "ASTRO_CHECK_STATUS=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Guard WebNext, Builder and SEO-specific Astro errors
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path('astro-check.log').read_text(encoding='utf-8', errors='replace')
          clean = re.sub(r'\x1b\[[0-9;]*m', '', text)
          guarded_paths = (
              'src/astro/pages/WebNextPage.astro',
              'src/astro/pages/CVStudioPage.astro',
              'src/pages/tao-cv-truc-tuyen/builder.astro',
              'src/lib/cvstudio/renderer.ts',
              'src/lib/cvstudio/cvExport.ts',
              'src/lib/cvstudio/cvExport.test.ts',
              'src/lib/cvstudio/renderer.test.ts',
              'src/astro/tablepress/Cvstudio_00.astro',
              'src/astro/tablepress/Cvstudio_01.astro',
              'src/astro/tablepress/Cvstudio_02.astro',
              'src/data/webnext.ts',
              'src/pages/[...slug].astro',
              'src/astro/tablepress/Webnext_06.astro',
              'src/astro/tablepress/Home_06.astro',
              'src/data/homeWebnext.test.ts',
              'src/pages/api/contact/index.ts',
              'src/pages/api/web-audit/index.ts',
              'src/pages/esc-builder/preview/[pageId].astro',
              'src/lib/wordpress/builderSectionDrafts.ts',
              'src/lib/googleServices.ts',
              'src/lib/marketingTags.ts',
              'src/lib/marketingPixels.ts',
              'src/astro/components/Layout/GoogleServices.astro',
              'src/astro/components/Layout/MarketingExtraTags.astro',
              'src/astro/components/Layout/MarketingPixels.astro',
          )
          errors = [
              line for line in clean.splitlines()
              if ' - error ' in line and any(path in line for path in guarded_paths)
          ]
          if errors:
              print('WebNext-specific Astro errors detected:')
              print('\n'.join(errors))
              sys.exit(1)

          status = int(__import__('os').environ.get('ASTRO_CHECK_STATUS', '0'))
          if status != 0:
              print('Full-repository Astro check still has inherited legacy errors; no WebNext-specific error was found.')
          else:
              print('Full-repository Astro check passed.')
          PY

      - name: Build development branch
        working-directory: source
        run: pnpm run build-git


      - name: Verify ESC CV Studio WordPress source and compiled page
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const jsonPath = 'dist/client/data/page-tao-cv-truc-tuyen.json';
          const htmlPath = 'dist/client/tao-cv-truc-tuyen/index.html';
          if (!fs.existsSync(jsonPath) || !fs.existsSync(htmlPath)) {
            throw new Error('CV Studio WordPress Page and built static route are missing.');
          }
          const page = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          const html = fs.readFileSync(htmlPath, 'utf8');
          if (page.key !== 'cv-studio' || page.action !== 'CVStudioPage') {
            throw new Error('CV Studio WordPress action/key must be source-owned and match Astro.');
          }
          const ids=['cvstudio_00','cvstudio_01','cvstudio_02'];
          const counts=[8,14,38];
          const found=(page.contents||[]).filter(row=>ids.includes(row?.shortcode));
          for (let i=0;i<ids.length;i++){
            const item=found.find(row=>row.shortcode===ids[i]);
            const n=Array.isArray(item?.data?.items)?item.data.items.length:0;
            if(n!==counts[i]) throw new Error(ids[i]+' rows mismatch: '+n);
            if(!html.includes('data-tablepress-preview="'+ids[i]+'"')) {
              throw new Error(ids[i]+' Astro component missing from generated HTML');
            }
          }
          const original=String(page.content||'');
          const positions=ids.map(id=>original.indexOf('[table id='+id+' /]'));
          if(positions.some(x=>x<0)||positions.some((x,i)=>i>0&&x<=positions[i-1])) {
            throw new Error('CV Studio Page shortcodes missing or out of order');
          }
          if(!html.includes('Không chỉ là CV.')||!html.includes('data-cv-studio')||
            html.includes('data-cv-dialog')||!html.includes('id="main-header"')) {
            throw new Error('CV gallery must be anonymous without the old login wizard');
          }
          const builderPath='dist/client/tao-cv-truc-tuyen/builder/index.html';
          if (!fs.existsSync(builderPath))throw new Error('Dedicated user CV Builder route was not generated');
          const builder=fs.readFileSync(builderPath,'utf8');
          if (!builder.includes('data-cv-builder') ||
              !builder.includes('data-cv-builder-fields') ||
              !builder.includes('data-cv-live-frame') ||
              !builder.includes('data-cv-export-menu') ||
              !builder.includes('data-cv-publish-dialog') ||
              !builder.includes('data-cv-publish-step="login"') ||
              !builder.includes('data-cv-publish-step="domain"')) {
            throw new Error('CV Builder does not provide editable schema fields with live template iframe');
          }
          if(html.includes('data-cv-step="editor"') ||
             html.includes('data-cv-step="preview"') ||
             !html.includes('data-cv-sample-preview')) {
            throw new Error('CV landing must remove old 3-field editor and include full-template preview modal');
          }
          console.log('ESC CV Studio production HTML, WP-owned copy, all ESC Tables: PASS');
          NODE

      - name: Verify URL routing cache behavior
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            compileRedirectRules,
            createRedirectMatcher,
          } from './scripts/redirect-rules.mjs';

          const redirects = JSON.parse(
            fs.readFileSync('.cache/redirects.json', 'utf8'),
          );
          const cms = JSON.parse(
            fs.readFileSync('dist/client/data/cms-common.json', 'utf8'),
          );

          if (!Array.isArray(redirects) || redirects.length === 0) {
            throw new Error('Routing cache is empty after WordPress REST is live.');
          }

          const pages = Array.isArray(cms.pages) ? cms.pages : [];
          const knbPages = pages.filter((page) => (
            page &&
            String(page.key || '').trim() === 'ssr-knb' &&
            String(page.slug || '').trim()
          ));

          if (knbPages.length === 0) {
            throw new Error('No published page with key=ssr-knb exists in cms-common.json.');
          }

          const matcher = createRedirectMatcher(
            compileRedirectRules(redirects),
            {
              pages: pages
                .filter((page) => page?.slug && page?.key)
                .map((page) => ({
                  slug: String(page.slug),
                  key: String(page.key),
                })),
              productCategories: Array.isArray(cms.productCategories)
                ? cms.productCategories
                : [],
            },
          );

          for (const page of knbPages) {
            const slug = String(page.slug).replace(/^\/+|\/+$/g, '');
            const result = matcher('/' + slug, '');

            if (
              !result ||
              String(result.type).toLowerCase() !== 'rewrite' ||
              result.to !== '/ssr/posts/' + slug + '/null'
            ) {
              throw new Error(
                'Knowledge-base root route failed for /' + slug +
                ': ' + JSON.stringify(result),
              );
            }

            console.log(
              'Knowledge-base root route passed:',
              '/' + slug,
              '->',
              result.to,
            );
          }

          const legacy = matcher('/support-esc/bai-viet-thu-nghiem', '');
          if (
            !legacy ||
            Number(legacy.type) !== 301 ||
            legacy.to !== '/bai-viet-thu-nghiem'
          ) {
            throw new Error(
              'Legacy /support-esc/<slug> redirect failed: ' +
              JSON.stringify(legacy),
            );
          }

          console.log(
            'Legacy support-esc redirect passed:',
            '/support-esc/bai-viet-thu-nghiem -> /bai-viet-thu-nghiem',
          );
          console.log('Routing cache contains', redirects.length, 'rule(s).');
          NODE

      - name: Smoke test built SSR routing runtime
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > /tmp/esc-ssr.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/esc-ssr.log || true' EXIT

          for attempt in {1..30}; do
            status="$(curl -sS -o /tmp/support-esc.html -w '%{http_code}' \
              --connect-timeout 2 --max-time 10 \
              http://127.0.0.1:4321/support-esc || true)"

            if [ "$status" = "200" ]; then
              if grep -Fq "TRANG KHÔNG TỒN TẠI" /tmp/support-esc.html; then
                echo "::error::HTTP 200 returned the 404 page content."
                exit 1
              fi

              echo "Built SSR /support-esc smoke test passed (HTTP 200)."
              exit 0
            fi

            echo "Attempt $attempt/30: /support-esc returned HTTP ${status:-curl-error}"
            sleep 1
          done

          echo "::error::Built SSR /support-esc smoke test failed."
          cat /tmp/esc-ssr.log || true
          exit 1
