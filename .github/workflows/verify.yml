name: Verify ESC Astro Development

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/verify-escvn.txt'

concurrency:
  group: escvn-actions-verify-escvn
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$ENV_FILE"

      - name: Checkout private ESC Astro source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: github
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Show source revision
        working-directory: source
        run: echo "Verifying escvn-astro@github $(git rev-parse HEAD)"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Make .env
        working-directory: source
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Run unit tests
        working-directory: source
        run: pnpm test:run

      - name: Run Astro check and capture inherited diagnostics
        working-directory: source
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee astro-check.log
          echo "ASTRO_CHECK_STATUS=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Guard WebNext-specific Astro errors
        working-directory: source
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path('astro-check.log').read_text(encoding='utf-8', errors='replace')
          clean = re.sub(r'\x1b\[[0-9;]*m', '', text)
          guarded_paths = (
              'src/astro/pages/WebNextPage.astro',
              'src/data/webnext.ts',
              'src/pages/[...slug].astro',
              'src/astro/tablepress/Webnext_06.astro',
              'src/pages/api/contact/index.ts',
              'src/pages/api/web-audit/index.ts',
          )
          errors = [
              line for line in clean.splitlines()
              if ' - error ' in line and any(path in line for path in guarded_paths)
          ]
          if errors:
              print('WebNext-specific Astro errors detected:')
              print('\n'.join(errors))
              sys.exit(1)

          status = int(__import__('os').environ.get('ASTRO_CHECK_STATUS', '0'))
          if status != 0:
              print('Full-repository Astro check still has inherited legacy errors; no WebNext-specific error was found.')
          else:
              print('Full-repository Astro check passed.')
          PY

      - name: Build development branch
        working-directory: source
        run: pnpm run build-git


      - name: Verify URL routing cache behavior
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            compileRedirectRules,
            createRedirectMatcher,
          } from './scripts/redirect-rules.mjs';

          const redirects = JSON.parse(
            fs.readFileSync('.cache/redirects.json', 'utf8'),
          );
          const cms = JSON.parse(
            fs.readFileSync('dist/client/data/cms-common.json', 'utf8'),
          );

          if (!Array.isArray(redirects) || redirects.length === 0) {
            throw new Error('Routing cache is empty after WordPress REST is live.');
          }

          const pages = Array.isArray(cms.pages) ? cms.pages : [];
          const knbPages = pages.filter((page) => (
            page &&
            String(page.key || '').trim() === 'ssr-knb' &&
            String(page.slug || '').trim()
          ));

          if (knbPages.length === 0) {
            throw new Error('No published page with key=ssr-knb exists in cms-common.json.');
          }

          const matcher = createRedirectMatcher(
            compileRedirectRules(redirects),
            {
              pages: pages
                .filter((page) => page?.slug && page?.key)
                .map((page) => ({
                  slug: String(page.slug),
                  key: String(page.key),
                })),
              productCategories: Array.isArray(cms.productCategories)
                ? cms.productCategories
                : [],
            },
          );

          for (const page of knbPages) {
            const slug = String(page.slug).replace(/^\/+|\/+$/g, '');
            const result = matcher('/' + slug, '');

            if (
              !result ||
              String(result.type).toLowerCase() !== 'rewrite' ||
              result.to !== '/ssr/posts/' + slug + '/null'
            ) {
              throw new Error(
                'Knowledge-base root route failed for /' + slug +
                ': ' + JSON.stringify(result),
              );
            }

            console.log(
              'Knowledge-base root route passed:',
              '/' + slug,
              '->',
              result.to,
            );
          }

          const legacy = matcher('/support-esc/bai-viet-thu-nghiem', '');
          if (
            !legacy ||
            Number(legacy.type) !== 301 ||
            legacy.to !== '/bai-viet-thu-nghiem'
          ) {
            throw new Error(
              'Legacy /support-esc/<slug> redirect failed: ' +
              JSON.stringify(legacy),
            );
          }

          console.log(
            'Legacy support-esc redirect passed:',
            '/support-esc/bai-viet-thu-nghiem -> /bai-viet-thu-nghiem',
          );
          console.log('Routing cache contains', redirects.length, 'rule(s).');
          NODE

      - name: Smoke test built SSR routing runtime
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          HOST=127.0.0.1 PORT=4321 node dist/server/entry.mjs > /tmp/esc-ssr.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/esc-ssr.log || true' EXIT

          for attempt in {1..30}; do
            status="$(curl -sS -o /tmp/support-esc.html -w '%{http_code}' \
              --connect-timeout 2 --max-time 10 \
              http://127.0.0.1:4321/support-esc || true)"

            if [ "$status" = "200" ]; then
              if grep -Fq "TRANG KHÔNG TỒN TẠI" /tmp/support-esc.html; then
                echo "::error::HTTP 200 returned the 404 page content."
                exit 1
              fi

              echo "Built SSR /support-esc smoke test passed (HTTP 200)."
              exit 0
            fi

            echo "Attempt $attempt/30: /support-esc returned HTTP ${status:-curl-error}"
            sleep 1
          done

          echo "::error::Built SSR /support-esc smoke test failed."
          cat /tmp/esc-ssr.log || true
          exit 1
