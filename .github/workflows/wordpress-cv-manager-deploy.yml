name: Deploy ESC CV Template Manager
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/wordpress-cv-manager-deploy.txt']
permissions:
  contents: read
concurrency:
  group: escvn-cv-template-manager-php
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout deploy request
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Validate target WordPress and exact PHP source
        id: target
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          for key in SOURCE_REPO_PAT FTP_SERVER FTP_USERNAME FTP_PASSWORD WP_ADMIN_URL; do
            test -n "${!key}"
          done
          source_sha="$(sed -n 's/^source_sha=//p' control/requests/wordpress-cv-manager-deploy.txt | tail -1 | tr -d '\r')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Bad PHP commit'; exit 1; }
          host="$(python3 - <<'PY'
          from urllib.parse import urlsplit
          import os
          raw=os.environ['WP_ADMIN_URL'].strip()
          parsed=urlsplit(raw if '://' in raw else 'https://'+raw)
          if parsed.hostname != 'admin.esc.vn':
              raise SystemExit('Unexpected WordPress host; refusing deployment')
          print(parsed.hostname)
          PY
          )"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "root=/domains/$host/public_html" >> "$GITHUB_OUTPUT"
      - name: Checkout escvn-php master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Install PHP 7.4 with ZIP support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: zip, mbstring
          tools: none
          coverage: none
      - name: PHP lint and standalone package/version regression
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          php -v
          php -r 'if (!class_exists("ZipArchive")) exit(1);'
          find source/wp-content/plugins/esc-cv-manager -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l source/wp-content/mu-plugins/esc-cv-manager-loader.php
          php source/wp-content/plugins/esc-cv-manager/tests/package-regression.php
          node --check source/wp-content/plugins/esc-cv-manager/assets/admin-preview.js
          node source/wp-content/plugins/esc-cv-manager/tests/preview-regression.cjs
          grep -Fq "0.1.2" source/wp-content/plugins/esc-cv-manager/esc-cv-manager.php
          grep -Fq "admin_post_esc_cv_edit" source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-admin.php
          grep -Fq "ESC_CV_Registry::add_package($package, 'create')" source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-admin.php
          grep -Fq "ESC_CV_Registry::add_package($package, 'update')" source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-admin.php
          grep -Fq "add_menu_page('ESC CV Manager'" source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-admin.php
          grep -Fq "ESC_CV_Registry::ensure_schema" source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-admin.php
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Stage CV Manager and check uploaded PHP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          ROOT: ${{ steps.target.outputs.root }}
        run: |
          set -euo pipefail
          proto="${FTP_PROTOCOL:-ftp}"
          case "$proto" in ftp|ftps|sftp) ;; *) echo 'Invalid FTP protocol'; exit 1;; esac
          endpoint="$proto://$FTP_SERVER"
          live="$ROOT/wp-content/plugins/esc-cv-manager"
          stage="$ROOT/wp-content/plugins/.esc-cv-stage-$GITHUB_RUN_ID"
          backup="$ROOT/wp-content/plugins/.esc-cv-backup-$GITHUB_RUN_ID"
          # The staging path is unique per run; no existing plugin is deleted.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ssl:verify-certificate no
          mirror -R --parallel=2 source/wp-content/plugins/esc-cv-manager "$stage"
          get "$stage/esc-cv-manager.php" -o /tmp/esc-cv-stage.php
          get "$stage/includes/class-esc-cv-admin.php" -o /tmp/esc-cv-stage-admin.php
          bye
          LFTP
          cmp source/wp-content/plugins/esc-cv-manager/esc-cv-manager.php /tmp/esc-cv-stage.php
          cmp source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-admin.php /tmp/esc-cv-stage-admin.php
          if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" -e "set cmd:fail-exit yes; cd \"$live\"; bye" >/dev/null 2>&1; then
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" -e "set cmd:fail-exit yes; mv \"$live\" \"$backup\"; bye"
          fi
          if ! lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" -e "set cmd:fail-exit yes; mv \"$stage\" \"$live\"; bye"; then
            echo '::error::Could not activate staged CV plugin; attempting recovery'
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" -e "set cmd:fail-exit yes; mv \"$backup\" \"$live\"; bye" || true
            exit 1
          fi
          # Install the loader only after validated plugin files are present.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ssl:verify-certificate no
          put "source/wp-content/mu-plugins/esc-cv-manager-loader.php" -o "$ROOT/wp-content/mu-plugins/esc-cv-manager-loader.php"
          get "$live/esc-cv-manager.php" -o /tmp/esc-cv-live.php
          get "$live/includes/class-esc-cv-package.php" -o /tmp/esc-cv-live-package.php
          get "$live/includes/class-esc-cv-registry.php" -o /tmp/esc-cv-live-registry.php
          get "$live/includes/class-esc-cv-admin.php" -o /tmp/esc-cv-live-admin.php
          get "$ROOT/wp-content/mu-plugins/esc-cv-manager-loader.php" -o /tmp/esc-cv-live-loader.php
          bye
          LFTP
          cmp source/wp-content/plugins/esc-cv-manager/esc-cv-manager.php /tmp/esc-cv-live.php
          cmp source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-package.php /tmp/esc-cv-live-package.php
          cmp source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-registry.php /tmp/esc-cv-live-registry.php
          cmp source/wp-content/plugins/esc-cv-manager/includes/class-esc-cv-admin.php /tmp/esc-cv-live-admin.php
          cmp source/wp-content/mu-plugins/esc-cv-manager-loader.php /tmp/esc-cv-live-loader.php
          echo 'ESC CV Manager PHP + MU loader deployed and byte-verified.'
      - name: Verify protected WordPress admin endpoint
        shell: bash
        env:
          WP_HOST: ${{ steps.target.outputs.host }}
        run: |
          set -euo pipefail
          # Logged-out access must never disclose ZIP data.
          # The admin page itself redirects to login; the DB remains private.
          response="$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "https://$WP_HOST/wp-admin/admin.php?page=esc-cv-manager" || true)"
          case "$response" in 200|302|403) echo "WP admin response: $response";; *) echo "::warning::WP admin responded $response";; esac
