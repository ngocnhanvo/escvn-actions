name: QA ESC Black Friday promotion live
on:
  push:
    branches: [main]
    paths: ['requests/wordpress-blackfriday-live-qa.txt']
permissions:
  contents: read
concurrency:
  group: escvn-edu20-qa
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install matching browser package
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Inspect live promotion card DOM
        run: node --check scripts/wordpress-blackfriday-live-qa.mjs
      - name: Check desktop mobile Black Friday modal banner and registration CTA
        run: node scripts/wordpress-blackfriday-live-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf2026-visual-qa
          path: |
            bf2026-layout-*.png
            bf2026-popup-*.png
            bf2026-error-*.png
          if-no-files-found: ignore
          retention-days: 3
