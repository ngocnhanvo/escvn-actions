name: Publish ESC Black Friday promotion
on:
  push:
    branches: [main]
    paths: ['requests/wordpress-blackfriday-promotion.txt']
permissions:
  contents: write
  actions: read
concurrency:
  group: escvn-edu20-promotion
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Validate request
        run: |
          grep -Fqx 'slug=khuyen-mai' requests/wordpress-blackfriday-promotion.txt
          grep -Fqx 'code_hosting=BFH2026' requests/wordpress-blackfriday-promotion.txt
          grep -Fqx 'code_vps=BFV2026' requests/wordpress-blackfriday-promotion.txt
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Check publisher and production tracking script syntax
        run: |
          node --check scripts/wordpress-blackfriday-promotion.mjs
          node --check scripts/wordpress-edu20-build-wait.mjs
      - name: Update WordPress promotion Page
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/wordpress-blackfriday-promotion.mjs
      - name: Record build window
        run: echo "DISPATCH_AFTER_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
      - name: Trigger existing production build
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          WP_BUILD_FORCE: '1'
        run: node scripts/wordpress-build-trigger-e2e.mjs
      - name: Wait for ESC production deploy success
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wordpress-edu20-build-wait.mjs
      - name: Live HTML smoke
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage();
            await page.goto('https://esc.vn/khuyen-mai',{waitUntil:'domcontentloaded',timeout:60000});
            const html=await page.content();
            for(const s of ['BLACK FRIDAY – SĂN DEAL VÀNG GIÁ KỊCH SÀN','BFH2026','BFV2026','Hosting và Email','25-29/11/2026','eCloud1']) assert.ok(html.includes(s),'Missing '+s);
            const heading=page.getByRole('heading',{name:'BLACK FRIDAY – SĂN DEAL VÀNG GIÁ KỊCH SÀN',exact:true});
            assert.ok(await heading.count(),'Promotion heading missing');
            console.log('BF_SPLIT_LIVE_PASS');
          } finally {await browser.close();}
          NODE
      - name: Record result for independent verification
        shell: bash
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
          DEPLOY_RUN_ID: 'see-EDU20_DEPLOY_RUN-in-job-log'
        run: |
          set -euo pipefail
          mkdir -p checks
          {
            echo 'scope=wordpress:khuyen-mai'
            echo 'promotion=BFH2026,BFV2026'
            echo "result=${JOB_RESULT}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "deploy_run_id=${DEPLOY_RUN_ID}"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > checks/wordpress-blackfriday-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bf2026-publish-status
          path: checks/wordpress-blackfriday-status.txt
          if-no-files-found: error
          retention-days: 14
