name: Deploy ESC CoCart Contact Integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/wordpress-esc-cocart-deploy.txt']
permissions:
  contents: read
concurrency:
  group: escvn-cocart-contact-php
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout deployment request
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Verify credentials, revision and WordPress destination
        id: preflight
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          for key in SOURCE_REPO_PAT FTP_SERVER FTP_USERNAME FTP_PASSWORD WP_ADMIN_URL; do
            test -n "${!key}"
          done
          revision="$(sed -n 's/^source_sha=//p' control/requests/wordpress-esc-cocart-deploy.txt | tail -n 1 | tr -d '\r')"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || { echo '::error::Invalid source SHA'; exit 1; }
          host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          raw = os.environ['WP_ADMIN_URL'].strip()
          u = urlsplit(raw if '://' in raw else 'https://' + raw)
          if u.hostname != 'admin.esc.vn':
              raise SystemExit('Unexpected WordPress host; refusing FTP operation')
          print(u.hostname)
          PY
          )"
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          echo "root=/domains/$host/public_html" >> "$GITHUB_OUTPUT"
      - name: Checkout ESC PHP master
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Check external ESC Contact API contract (no Woo/CoCart edits)
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          php -l source/wp-content/plugins/esc-cocart-integration/esc-cocart-integration.php
          python3 - <<'PY'
          from pathlib import Path
          integration = Path('source/wp-content/plugins/esc-cocart-integration/esc-cocart-integration.php').read_text()
          checkout = Path('source/wp-content/themes/vibe-code-theme/inc/checkout/checkout_endpoint.php').read_text()
          assert integration.count("'city'       => ''") == 1, 'External ESC Contact city must be blank'
          assert "'province'   => $order->get_billing_state()" in integration
          assert "'registercontactorg' : 'registercontactind'" in integration
          assert "$order->set_billing_city(" in checkout, 'Woo billing city setter must remain intact'
          assert "esc_bacs_account_for_city( $billing['city'] ?? '' )" in checkout, 'Regional bank routing must stay intact'
          print('ESC Contact payload city is empty; checkout and bank routing unchanged.')
          PY
      - name: Install lftp
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq lftp
      - name: Back up remote plugin and reject unrelated FTP changes
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          WP_ROOT: ${{ steps.preflight.outputs.root }}
        run: |
          set -euo pipefail
          protocol="${FTP_PROTOCOL:-ftp}"
          case "$protocol" in ftp|ftps|sftp) ;; *) exit 1;; esac
          remote="$WP_ROOT/wp-content/plugins/esc-cocart-integration/esc-cocart-integration.php"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$protocol://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ssl:verify-certificate no
          get "$remote" -o /tmp/esc-cocart-integration.backup.php
          bye
          LFTP
          current="$(git hash-object /tmp/esc-cocart-integration.backup.php)"
          case "$current" in
            9fc6162fe312c66627df312de0d514fd6928a3d8|a67a4226ca005a69d5b22c933368d4d197ce4d40)
              echo 'Live plugin matches known ESC baseline or requested change.' ;;
            *) echo "::error::Remote CoCart plugin has unrelated differences. Not overwriting it."; exit 1;;
          esac
      - name: Upload only ESC Contact Integration PHP and read-back verify
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          WP_ROOT: ${{ steps.preflight.outputs.root }}
        run: |
          set -euo pipefail
          protocol="${FTP_PROTOCOL:-ftp}"
          case "$protocol" in ftp|ftps|sftp) ;; *) exit 1;; esac
          remote="$WP_ROOT/wp-content/plugins/esc-cocart-integration/esc-cocart-integration.php"
          source_file="source/wp-content/plugins/esc-cocart-integration/esc-cocart-integration.php"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$protocol://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ssl:verify-certificate no
          put "$source_file" -o "$remote"
          get "$remote" -o /tmp/esc-cocart-integration.verified.php
          bye
          LFTP
          if ! cmp -s "$source_file" /tmp/esc-cocart-integration.verified.php; then
            echo '::error::FTP verification failed. Restoring previous plugin version.'
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$protocol://$FTP_SERVER" -e "set cmd:fail-exit yes; put /tmp/esc-cocart-integration.backup.php -o \"$remote\"; bye" || true
            exit 1
          fi
          echo 'ESC external Contact payload city override deployed and byte-verified.'
          echo 'Only esc-cocart-integration.php was uploaded.' >> "$GITHUB_STEP_SUMMARY"
