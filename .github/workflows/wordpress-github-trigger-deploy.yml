name: Deploy ESC GitHub Trigger Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/wordpress-github-trigger-deploy.txt'

permissions:
  contents: write

concurrency:
  group: escvn-actions-wordpress-github-trigger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$WP_ADMIN_URL"

      - name: Checkout deployment request
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: true

      - name: Resolve requested source revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file="control/requests/wordpress-github-trigger-deploy.txt"
          test -f "$request_file"
          expected_sha="$(sed -n 's/^source_sha=//p' "$request_file" | tail -n 1 | tr -d '\r')"
          if ! printf '%s' "$expected_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Invalid source_sha in deployment request."
            exit 1
          fi
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout ESC WordPress production source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Verify production source revision
        working-directory: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Deploying escvn-php@master $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Validate GitHub trigger runtime
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/plugins/github-trigger/vcs-build-trigger.php
          php -l wp-content/plugins/github-trigger/tests/build-status-regression.php
          php wp-content/plugins/github-trigger/tests/build-status-regression.php
          grep -Fq "define('VCS_GH_REPO', 'escvn-actions')" wp-content/plugins/github-trigger/vcs-build-trigger.php
          grep -Fq "private const BUILD_LOCK_OPTION = 'vcs_build_lock'" wp-content/plugins/github-trigger/vcs-build-trigger.php
          grep -Fq "'code' => 'build_in_progress'" wp-content/plugins/github-trigger/vcs-build-trigger.php
          grep -Fq "data.code === 'build_in_progress'" wp-content/plugins/github-trigger/vcs-build-trigger.js

      - name: Resolve WordPress FTP path
        id: wp_path
        shell: bash
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          raw = os.environ["WP_ADMIN_URL"].strip()
          parsed = urlparse(raw if "://" in raw else "https://" + raw)
          if not parsed.hostname:
              raise SystemExit("Unable to resolve hostname from WP_ADMIN_URL")
          print(parsed.hostname)
          PY
          )"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "remote_wp_root=/domains/$host/public_html" >> "$GITHUB_OUTPUT"

      - name: Install FTP client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp

      - name: Deploy GitHub trigger runtime through FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          REMOTE_WP_ROOT: ${{ steps.wp_path.outputs.remote_wp_root }}
        run: |
          set -euo pipefail
          protocol="${FTP_PROTOCOL:-ftp}"
          export protocol FTP_SERVER FTP_USERNAME FTP_PASSWORD

          ftp_url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          protocol = os.environ.get("protocol", "ftp")
          server = os.environ["FTP_SERVER"]
          username = quote(os.environ["FTP_USERNAME"], safe="")
          password = quote(os.environ["FTP_PASSWORD"], safe="")
          print(f"{protocol}://{username}:{password}@{server}")
          PY
          )"

          lftp "$ftp_url" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 3
          set ssl:verify-certificate no

          put "source/wp-content/plugins/github-trigger/vcs-build-trigger.php" -o "$REMOTE_WP_ROOT/wp-content/plugins/github-trigger/vcs-build-trigger.php"
          put "source/wp-content/plugins/github-trigger/vcs-build-trigger.js" -o "$REMOTE_WP_ROOT/wp-content/plugins/github-trigger/vcs-build-trigger.js"

          get "$REMOTE_WP_ROOT/wp-content/plugins/github-trigger/vcs-build-trigger.php" -o /tmp/vcs-build-trigger.remote.php
          get "$REMOTE_WP_ROOT/wp-content/plugins/github-trigger/vcs-build-trigger.js" -o /tmp/vcs-build-trigger.remote.js
          bye
          LFTP

          cmp source/wp-content/plugins/github-trigger/vcs-build-trigger.php /tmp/vcs-build-trigger.remote.php
          cmp source/wp-content/plugins/github-trigger/vcs-build-trigger.js /tmp/vcs-build-trigger.remote.js
          echo "ESC GitHub trigger runtime deployed and byte-verified."

      - name: Record deployment result
        if: always()
        working-directory: control
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p results
          {
            echo "workflow=Deploy ESC GitHub Trigger Runtime"
            echo "status=$JOB_STATUS"
            echo "source_repo=ngocnhanvo/escvn-php"
            echo "source_branch=master"
            echo "source_sha=${EXPECTED_SHA:-unknown}"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > results/wordpress-github-trigger-deploy.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/wordpress-github-trigger-deploy.txt
          git commit -m "Record GitHub trigger deploy result #$GITHUB_RUN_ID" || exit 0
          git push origin HEAD:main
