name: ESC HKD Google PHP
on:
  push:
    branches: [main]
    paths: ['requests/wordpress-hkd-google-php.txt']
permissions:
  contents: read
concurrency:
  group: esc-hkd-google-php
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source SHA and scope
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          grep -Fqx 'scope=google_php_only' requests/wordpress-hkd-google-php.txt
          sha="$(sed -n 's/^source_sha=//p' requests/wordpress-hkd-google-php.txt | head -n1)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "EXPECTED_SHA=$sha" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: php
      - name: Lint source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C php rev-parse HEAD)" = "$EXPECTED_SHA"
          php -l php/wp-content/plugins/esc-hkd/google-config.php
          php -l php/wp-content/plugins/esc-hkd/esc-hkd.php
          node --check scripts/wordpress-hkd-google-config-qa.mjs
      - name: Deploy two HKD PHP files
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          sudo apt-get update -y -qq >/dev/null
          sudo apt-get install -y -qq lftp >/dev/null
          root=/domains/admin.esc.vn/public_html/wp-content/plugins/esc-hkd
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "${FTP_PROTOCOL:-ftp}://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force yes
          set ssl:verify-certificate yes
          put "php/wp-content/plugins/esc-hkd/google-config.php" -o "$root/google-config.php"
          put "php/wp-content/plugins/esc-hkd/esc-hkd.php" -o "$root/esc-hkd.php"
          get "$root/google-config.php" -o /tmp/esc-hkd-google-config.php
          get "$root/esc-hkd.php" -o /tmp/esc-hkd-google-bootstrap.php
          bye
          LFTP
          cmp php/wp-content/plugins/esc-hkd/google-config.php /tmp/esc-hkd-google-config.php
          cmp php/wp-content/plugins/esc-hkd/esc-hkd.php /tmp/esc-hkd-google-bootstrap.php
          rm -f /tmp/esc-hkd-google-config.php /tmp/esc-hkd-google-bootstrap.php
          # Retire the unused legacy config only after both replacement files
          # have passed their FTP round-trip byte checks.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "${FTP_PROTOCOL:-ftp}://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force yes
          set ssl:verify-certificate yes
          rm -f "$root/goong-config.php"
          bye
          LFTP
          echo 'HKD Google PHP deployment PASS'
  qa:
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install Playwright driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Check Google configuration API and WP admin
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/wordpress-hkd-google-config-qa.mjs
