name: ESC HKD Step 5 Admin
on:
  push:
    branches: [main]
    paths: ['requests/wordpress-hkd-step5.txt']
permissions:
  contents: read
concurrency:
  group: esc-wordpress-hkd-step5
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout control
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Validate request
        id: gate
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT" && test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          request=control/requests/wordpress-hkd-step5.txt
          grep -Fqx 'step=5' "$request"
          grep -Fqx 'scope=admin_management' "$request"
          sha="$(sed -n 's/^source_sha=//p' "$request" | head -n 1 | tr -d '\r')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout PHP application
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source
      - name: Verify source and PHP syntax
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          php -l source/wp-content/plugins/esc-hkd/esc-hkd.php
          php -l source/wp-content/plugins/esc-hkd/admin-pages.php
          php -l source/wp-content/plugins/esc-hkd/admin-transactions.php
          node --check control/scripts/wordpress-hkd-step5.mjs
      - name: Deploy only HKD back-office code
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq >/dev/null
          sudo apt-get install -y -qq lftp >/dev/null
          root=/domains/admin.esc.vn/public_html/wp-content/plugins/esc-hkd
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "${FTP_PROTOCOL:-ftp}://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force yes
          set ssl:verify-certificate yes
          put "source/wp-content/plugins/esc-hkd/admin-transactions.php" -o "$root/admin-transactions.php"
          put "source/wp-content/plugins/esc-hkd/admin-pages.php" -o "$root/admin-pages.php"
          put "source/wp-content/plugins/esc-hkd/esc-hkd.php" -o "$root/esc-hkd.php"
          get "$root/admin-transactions.php" -o "/tmp/esc-hkd-admin-transactions.php"
          get "$root/admin-pages.php" -o "/tmp/esc-hkd-admin-pages.php"
          get "$root/esc-hkd.php" -o "/tmp/esc-hkd.php"
          bye
          LFTP
          cmp source/wp-content/plugins/esc-hkd/admin-transactions.php /tmp/esc-hkd-admin-transactions.php
          cmp source/wp-content/plugins/esc-hkd/admin-pages.php /tmp/esc-hkd-admin-pages.php
          cmp source/wp-content/plugins/esc-hkd/esc-hkd.php /tmp/esc-hkd.php
          rm -f /tmp/esc-hkd-admin-transactions.php /tmp/esc-hkd-admin-pages.php /tmp/esc-hkd.php
          echo "HKD Step5 PHP deployment PASS"
  qa:
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install matching Playwright
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify admin-only pages and REST regression
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/wordpress-hkd-step5.mjs
