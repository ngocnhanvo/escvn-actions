name: ESC HKD Step 6 Build Website
on:
  push:
    branches: [main]
    paths: ['requests/wordpress-hkd-step6-build.txt']
permissions:
  contents: read
concurrency:
  group: esc-hkd-step6-build-request
  cancel-in-progress: false
jobs:
  trigger-via-wordpress:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 18
    steps:
      - name: Checkout Actions control
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify explicit request and source SHA
        id: gate
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          grep -Fqx 'step=6' requests/wordpress-hkd-step6-build.txt
          grep -Fqx 'trigger=wordpress_build_website' requests/wordpress-hkd-step6-build.txt
          sha="$(sed -n 's/^astro_sha=//p' requests/wordpress-hkd-step6-build.txt | tr -d '\r')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout Astro production source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-astro
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: astro
      - name: Verify exact Astro commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C astro rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f astro/src/pages/ban-do-ho-kinh-doanh/index.astro
      - name: Install matching browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Trigger build only through WordPress Build Website
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          WP_BUILD_FORCE: '1'
        run: node scripts/wordpress-build-trigger-e2e.mjs
