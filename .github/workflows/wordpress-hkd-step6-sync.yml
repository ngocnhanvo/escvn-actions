name: ESC HKD Step 6 Sync One Route
on:
  push:
    branches: [main]
    paths: ['requests/wordpress-hkd-step6-sync.txt']
permissions:
  contents: read
concurrency:
  group: esc-hkd-step6-sync
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify exact scope and PHP syntax
        run: |
          set -euo pipefail
          grep -Fqx 'step=6' requests/wordpress-hkd-step6-sync.txt
          grep -Fqx 'scope=route_55522_event' requests/wordpress-hkd-step6-sync.txt
          php -l scripts/esc-hkd-route-sync-once.php
      - name: Stage temporary read-checked WordPress admin tool
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          sudo apt-get update -qq -y >/dev/null
          sudo apt-get install -qq -y lftp >/dev/null
          root=/domains/admin.esc.vn/public_html/wp-content/mu-plugins
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "${FTP_PROTOCOL:-ftp}://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ssl:verify-certificate yes
          set net:max-retries 2
          set net:timeout 20
          put "scripts/esc-hkd-route-sync-once.php" -o "$root/esc-hkd-route-sync-once.php"
          get "$root/esc-hkd-route-sync-once.php" -o "/tmp/esc-hkd-route-sync-once.php"
          bye
          LFTP
          cmp scripts/esc-hkd-route-sync-once.php /tmp/esc-hkd-route-sync-once.php
          rm /tmp/esc-hkd-route-sync-once.php
          echo 'HKD temporary helper staged and verified'
  execute:
    needs: stage
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install matching browser
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Record route event with WordPress nonce and verify
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
        run: node scripts/wordpress-hkd-step6-sync-event.mjs
  cleanup:
    needs: [stage, execute]
    if: always() && needs.stage.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Remove temporary WordPress helper
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq -y >/dev/null
          sudo apt-get install -qq -y lftp >/dev/null
          root=/domains/admin.esc.vn/public_html/wp-content/mu-plugins
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "${FTP_PROTOCOL:-ftp}://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ssl:verify-certificate yes
          set net:max-retries 2
          rm "$root/esc-hkd-route-sync-once.php"
          bye
          LFTP
          echo 'HKD temporary helper removed'
