name: ESC HKD Step 7 Registrations
on:
  push:
    branches: [main]
    paths: ['requests/wordpress-hkd-step7.txt']
permissions:
  contents: read
concurrency:
  group: esc-hkd-step7-php
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Verify deployment request and credentials
        id: gate
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT" && test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          req=control/requests/wordpress-hkd-step7.txt
          grep -Fqx 'step=7' "$req"
          grep -Fqx 'scope=registrations_php' "$req"
          sha="$(sed -n 's/^source_sha=//p' "$req" | head -n 1 | tr -d '\r')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: php
      - name: Lint exact PHP source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C php rev-parse HEAD)" = "$EXPECTED_SHA"
          php -l php/wp-content/plugins/esc-hkd/esc-hkd.php
          php -l php/wp-content/plugins/esc-hkd/registrations.php
          php -l php/wp-content/plugins/esc-hkd/admin-transactions.php
          node --check control/scripts/wordpress-hkd-step7-qa.mjs
      - name: Deploy two HKD plugin files via secure FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq >/dev/null
          sudo apt-get install -y -qq lftp >/dev/null
          root=/domains/admin.esc.vn/public_html/wp-content/plugins/esc-hkd
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "${FTP_PROTOCOL:-ftp}://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force yes
          set ssl:verify-certificate yes
          put "php/wp-content/plugins/esc-hkd/registrations.php" -o "$root/registrations.php"
          put "php/wp-content/plugins/esc-hkd/esc-hkd.php" -o "$root/esc-hkd.php"
          get "$root/registrations.php" -o /tmp/esc-hkd-step7-reg.php
          get "$root/esc-hkd.php" -o /tmp/esc-hkd-step7-bootstrap.php
          bye
          LFTP
          cmp php/wp-content/plugins/esc-hkd/registrations.php /tmp/esc-hkd-step7-reg.php
          cmp php/wp-content/plugins/esc-hkd/esc-hkd.php /tmp/esc-hkd-step7-bootstrap.php
          rm -f /tmp/esc-hkd-step7-reg.php /tmp/esc-hkd-step7-bootstrap.php
          echo 'HKD Step7 PHP deploy PASS'
  qa:
    needs: deploy
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Verify public API rejects invalid submissions without any data writes
        run: node scripts/wordpress-hkd-step7-qa.mjs
