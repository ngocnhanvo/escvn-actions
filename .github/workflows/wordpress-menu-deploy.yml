name: Deploy ESC WordPress Menu Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'requests/wordpress-menu-deploy.txt'

permissions:
  contents: read

concurrency:
  group: escvn-actions-wordpress-menu-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$WP_ADMIN_URL"

      - name: Checkout ESC WordPress production source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false

      - name: Show production source revision
        id: source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying escvn-php@master $sha"

      - name: Validate menu runtime
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          php -l wp-content/themes/vibe-code-theme/inc/tools/menu.php
          php -l wp-content/themes/vibe-code-theme/inc/tools/disable.php
          php tools/menu-admin-entry.test.php
          php -r '
            $path = "wp-content/themes/vibe-code-theme/inc/tools/menu-seed.json";
            $data = json_decode(file_get_contents($path), true);
            if (!is_array($data)) {
                fwrite(STDERR, "menu-seed.json is invalid\n");
                exit(1);
            }
            $header = array_values(array_filter($data, static function ($item) {
                return !empty($item["slug"]) && (($item["header"] ?? true) === true);
            }));
            if (count($header) !== 18) {
                fwrite(STDERR, "Expected 18 seeded header records, got " . count($header) . "\n");
                exit(1);
            }
            echo "Validated menu seed: " . count($header) . " header records.\n";
          '

      - name: Resolve WordPress FTP path
        id: wp_path
        shell: bash
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = os.environ["WP_ADMIN_URL"].strip()
          parsed = urlparse(raw if "://" in raw else "https://" + raw)
          if not parsed.hostname:
              raise SystemExit("Unable to resolve hostname from WP_ADMIN_URL")
          print(parsed.hostname)
          PY
          )"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "remote_tools=/domains/$host/public_html/wp-content/themes/vibe-code-theme/inc/tools" >> "$GITHUB_OUTPUT"
          echo "Resolved WordPress production host for FTP deployment."

      - name: Deploy menu runtime through FTP
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          REMOTE_TOOLS: ${{ steps.wp_path.outputs.remote_tools }}
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y lftp

          protocol="${FTP_PROTOCOL:-ftp}"
          export protocol FTP_SERVER FTP_USERNAME FTP_PASSWORD

          ftp_url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          protocol = os.environ.get("protocol", "ftp")
          server = os.environ["FTP_SERVER"]
          username = quote(os.environ["FTP_USERNAME"], safe="")
          password = quote(os.environ["FTP_PASSWORD"], safe="")
          print(f"{protocol}://{username}:{password}@{server}")
          PY
          )"

          lftp "$ftp_url" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 3
          set ssl:verify-certificate no

          cd "$REMOTE_TOOLS"
          put "source/wp-content/themes/vibe-code-theme/inc/tools/menu.php" -o "menu.php"
          put "source/wp-content/themes/vibe-code-theme/inc/tools/menu-seed.json" -o "menu-seed.json"
          put "source/wp-content/themes/vibe-code-theme/inc/tools/disable.php" -o "disable.php"

          get "menu.php" -o /tmp/menu.remote.php
          get "menu-seed.json" -o /tmp/menu-seed.remote.json
          get "disable.php" -o /tmp/disable.remote.php

          bye
          LFTP

          cmp source/wp-content/themes/vibe-code-theme/inc/tools/menu.php /tmp/menu.remote.php
          cmp source/wp-content/themes/vibe-code-theme/inc/tools/menu-seed.json /tmp/menu-seed.remote.json
          cmp source/wp-content/themes/vibe-code-theme/inc/tools/disable.php /tmp/disable.remote.php
          rm -f /tmp/menu.remote.php /tmp/menu-seed.remote.json /tmp/disable.remote.php
          echo "ESC WordPress menu runtime deployed and byte-verified."

      - name: Smoke test Menu API
        shell: bash
        env:
          WP_HOST: ${{ steps.wp_path.outputs.host }}
        run: |
          set -euo pipefail
          endpoint="https://$WP_HOST/wp-json/esc-api/v1/menus"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          for attempt in {1..6}; do
            status="$(curl -L -sS -o "$body" -w '%{http_code}' --connect-timeout 10 --max-time 30 "$endpoint" || true)"
            if [ "$status" = "200" ] && python3 - "$body" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          menus = payload.get("menus", {})
          header = menus.get("Header", {})
          vi = header.get("vi", {})
          en = header.get("en", {})

          assert payload.get("success") is True
          assert vi.get("type") == "mega"
          assert en.get("type") == "mega"
          assert len(vi.get("items", [])) == 9
          assert len(en.get("items", [])) == 9
          PY
            then
              echo "Menu API smoke test passed (HTTP 200, Header vi/en = 9 items each)."
              exit 0
            fi

            echo "Attempt $attempt/6 failed (HTTP ${status:-curl-error}); retrying..."
            sleep 5
          done

          echo "::error::Menu API smoke test failed."
          test -s "$body" && head -c 1000 "$body" || true
          exit 1
