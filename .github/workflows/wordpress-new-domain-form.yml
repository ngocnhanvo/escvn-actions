name: Deploy ESC new domain CF7 bridge
on:
  push:
    branches: [main]
    paths: ['requests/wordpress-new-domain-form.txt']
permissions:
  contents: read
concurrency:
  group: esc-new-domain-php
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify request and credentials
        id: request
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_PAT"
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          sha="$(sed -n 's/^source_sha=//p' requests/wordpress-new-domain-form.txt | head -n 1 | tr -d '\r')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: php
      - name: Validate PHP and revision
        env:
          SOURCE_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git -C php rev-parse HEAD)" = "$SOURCE_SHA"
          php -l php/wp-content/mu-plugins/esc-new-domain-form.php
      - name: Deploy only the new mu-plugin
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
        run: |
          set -euo pipefail
          sudo apt-get update -y -qq >/dev/null
          sudo apt-get install -y -qq lftp >/dev/null
          target=/domains/admin.esc.vn/public_html/wp-content/mu-plugins/esc-new-domain-form.php
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "${FTP_PROTOCOL:-ftp}://$FTP_SERVER" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set ssl:verify-certificate yes
          put "php/wp-content/mu-plugins/esc-new-domain-form.php" -o "$target"
          get "$target" -o /tmp/esc-new-domain-form.php
          bye
          LFTP
          cmp php/wp-content/mu-plugins/esc-new-domain-form.php /tmp/esc-new-domain-form.php
          rm -f /tmp/esc-new-domain-form.php
          echo 'ESC CF7 bridge uploaded and byte-verified'
      - name: Verify live CF7 bridge
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl -fsSL --connect-timeout 10 --max-time 30 'https://admin.esc.vn/wp-json/esc-new-domain/v1/consultation-form')"
          RESPONSE_BODY="$result" node -e 'const p=JSON.parse(process.env.RESPONSE_BODY);if(!Number.isSafeInteger(p.id)||p.id<=0||typeof p.html!=="string"||!p.html.includes("wpcf7-form")) process.exit(1); console.log("WordPress CF7 form ID verified:",p.id)'
