name: Deploy ESC Visual Builder PHP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/wordpress-visual-builder-deploy.txt']
permissions:
  contents: read
concurrency:
  group: escvn-visual-builder-php
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - name: Validate target, credentials and source SHA
        id: preflight
        shell: bash
        env:
          SOURCE_REPO_PAT: ${{ secrets.SOURCE_REPO_PAT }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
        run: |
          set -euo pipefail
          for key in SOURCE_REPO_PAT FTP_SERVER FTP_USERNAME FTP_PASSWORD WP_ADMIN_URL; do test -n "${!key}"; done
          sha="$(sed -n 's/^source_sha=//p' control/requests/wordpress-visual-builder-deploy.txt | tail -n 1 | tr -d '\r')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Invalid source SHA'; exit 1; }
          host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          raw=os.environ['WP_ADMIN_URL'].strip()
          u=urlsplit(raw if '://' in raw else 'https://'+raw)
          if u.hostname != 'admin.esc.vn':
              raise SystemExit('Unexpected WordPress host: only admin.esc.vn is allowed')
          print(u.hostname)
          PY
          )"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "remote_root=/domains/$host/public_html" >> "$GITHUB_OUTPUT"
          echo "wp_host=$host" >> "$GITHUB_OUTPUT"
      - name: Checkout ESC PHP production source
        uses: actions/checkout@v4
        with:
          repository: ngocnhanvo/escvn-php
          ref: master
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          persist-credentials: false
      - name: Validate source revision and PHP syntax
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f source/wp-content/mu-plugins/esc-visual-builder-loader.php
          test -f source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          grep -Fq "add_pages_page('ESC Visual Builder'" source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php
          php -l source/wp-content/mu-plugins/esc-visual-builder-loader.php
          find source/wp-content/plugins/esc-visual-builder -name '*.php' -print0 | xargs -0 -n1 php -l
          php source/wp-content/plugins/esc-visual-builder/tests/key-value-content.php
      - name: Install lftp
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq lftp
      - name: Stage plugin, switch atomically and upload MU loader
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
          ROOT: ${{ steps.preflight.outputs.remote_root }}
          EXPECTED_SHA: ${{ steps.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          protocol="${FTP_PROTOCOL:-ftp}"
          case "$protocol" in ftp|ftps|sftp) ;; *) echo 'Invalid FTP_PROTOCOL'; exit 1;; esac
          endpoint="$protocol://$FTP_SERVER"
          live="$ROOT/wp-content/plugins/esc-visual-builder"
          stage="$ROOT/wp-content/plugins/.esc-vb-stage-$GITHUB_RUN_ID"
          backup="$ROOT/wp-content/plugins/.esc-vb-backup-$GITHUB_RUN_ID"
          mu="$ROOT/wp-content/mu-plugins/esc-visual-builder-loader.php"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 25
          set ssl:verify-certificate no
          mirror -R --parallel=2 source/wp-content/plugins/esc-visual-builder "$stage"
          get "$stage/esc-visual-builder.php" -o /tmp/esc-vb-staged.php
          bye
          LFTP
          cmp source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php /tmp/esc-vb-staged.php
          if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" -e "set cmd:fail-exit yes; cd \"$live\"; bye" >/dev/null 2>&1; then
            echo 'Backing up existing Visual Builder directory.'
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" -e "set cmd:fail-exit yes; mv \"$live\" \"$backup\"; bye"
          fi
          if ! lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" -e "set cmd:fail-exit yes; mv \"$stage\" \"$live\"; bye"; then
            echo '::error::Unable to activate plugin; attempting rollback'
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" -e "set cmd:fail-exit yes; mv \"$backup\" \"$live\"; bye" || true
            exit 1
          fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$endpoint" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 25
          set ssl:verify-certificate no
          put "source/wp-content/mu-plugins/esc-visual-builder-loader.php" -o "$mu"
          get "$live/esc-visual-builder.php" -o /tmp/esc-vb-live.php
          get "$live/includes/item-section-ui.php" -o /tmp/esc-vb-ui-live.php
          get "$live/includes/key-value-seed.php" -o /tmp/esc-vb-seed-live.php
          get "$mu" -o /tmp/esc-vb-loader-live.php
          bye
          LFTP
          cmp source/wp-content/plugins/esc-visual-builder/esc-visual-builder.php /tmp/esc-vb-live.php
          cmp source/wp-content/plugins/esc-visual-builder/includes/item-section-ui.php /tmp/esc-vb-ui-live.php
          cmp source/wp-content/plugins/esc-visual-builder/includes/key-value-seed.php /tmp/esc-vb-seed-live.php
          cmp source/wp-content/mu-plugins/esc-visual-builder-loader.php /tmp/esc-vb-loader-live.php
          echo 'ESC Visual Builder PHP and MU loader deployed and byte-verified.'
          echo "Source revision: $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "WordPress: Pages -> Visual Builder" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify ESC Builder public REST route
        shell: bash
        env:
          WP_HOST: ${{ steps.preflight.outputs.wp_host }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl -L -sS -o "$body" -w '%{http_code}' --max-time 25 "https://$WP_HOST/wp-json/" || true)"
          if [ "$status" = 200 ] && python3 - "$body" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert '/esc-builder/v1/verify' in d.get('routes',{})
          PY
          then
            echo 'ESC Visual Builder REST routes are registered by live WordPress.'
          else
            echo "::warning::REST route could not be checked (HTTP $status); verify WordPress Pages -> Visual Builder."
          fi
