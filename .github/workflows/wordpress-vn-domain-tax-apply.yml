name: Apply approved ESC Vietnam domain tax status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/wordpress-vn-domain-tax-apply.yml']
permissions:
  contents: read
concurrency:
  group: esc-vn-domain-tax-write
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - name: Install matching Playwright client
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.0
      - name: Apply approved tax status using authenticated WordPress admin
        env:
          WP_ADMIN_URL: ${{ secrets.WP_ADMIN_URL }}
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          cat > /tmp/esc-tax-placeholder <<'EOF'
          EOF
          cat > tax-apply.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          import {mkdirSync,writeFileSync} from 'node:fs';
          const manifest=[{"id":51235,"name":".vinhlong.vn","variations":[51246,51245,51244,51243,51242,51241,51240,51239,51238,51237]},{"id":51220,"name":".tuyenquang.vn","variations":[51232,51231,51230,51229,51228,51227,51226,51225,51224,51223]},{"id":51201,"name":".hue.vn","variations":[51219,51218,51217,51216,51215,51214,51213,51212,51211,51210]},{"id":51178,"name":".thanhphohochiminh.vn","variations":[51196,51195,51194,51193,51192,51191,51190,51189,51188,51187]},{"id":51162,"name":".thanhhoa.vn","variations":[51175,51174,51173,51172,51171,51170,51169,51168,51167,51166]},{"id":51149,"name":".thainguyen.vn","variations":[51159,51158,51157,51156,51155,51154,51153,51152,51151,51150]},{"id":51134,"name":".tayninh.vn","variations":[51147,51146,51145,51144,51143,51142,51141,51140,51139,51138]},{"id":51089,"name":".sonla.vn","variations":[51101,51100,51099,51098,51097,51096,51095,51094,51093,51092]},{"id":51061,"name":".quangtri.vn","variations":[51084,51083,51082,51081,51080,51079,51078,51077,51076,51075]},{"id":51047,"name":".quangninh.vn","variations":[51057,51056,51055,51054,51053,51052,51051,51050,51049,51048]},{"id":51030,"name":".quangngai.vn","variations":[51045,51044,51043,51042,51041,51040,51039,51038,51037,51036]},{"id":51016,"name":".phutho.vn","variations":[51027,51026,51025,51024,51023,51022,51021,51020,51019,51018]},{"id":50971,"name":".ninhbinh.vn","variations":[50991,50990,50989,50988,50987,50986,50985,50984,50983,50982]},{"id":50960,"name":".nghean.vn","variations":[50970,50969,50968,50967,50966,50965,50964,50963,50962,50961]},{"id":50948,"name":".laocai.vn","variations":[50959,50958,50957,50956,50955,50954,50953,50952,50951,50950]},{"id":50921,"name":".langson.vn","variations":[50936,50935,50934,50933,50932,50931,50930,50929,50928,50927]},{"id":50904,"name":".lamdong.vn","variations":[50917,50916,50915,50914,50913,50912,50911,50910,50909,50908]},{"id":50885,"name":".laichau.vn","variations":[50901,50900,50899,50898,50897,50896,50895,50894,50893,50892]},{"id":50872,"name":".khanhhoa.vn","variations":[50882,50881,50880,50879,50878,50877,50876,50875,50874,50873]},{"id":50777,"name":".hungyen.vn","variations":[50869,50868,50867,50866,50865,50864,50863,50862,50861,50860]},{"id":50764,"name":".hatinh.vn","variations":[50774,50773,50772,50771,50770,50769,50768,50767,50766,50765]},{"id":50751,"name":".haiphong.vn","variations":[50761,50760,50759,50758,50757,50756,50755,50754,50753,50752]},{"id":50738,"name":".gialai.vn","variations":[50748,50747,50746,50745,50744,50743,50742,50741,50740,50739]},{"id":50725,"name":".dongthap.vn","variations":[50735,50734,50733,50732,50731,50730,50729,50728,50727,50726]},{"id":50699,"name":".dongnai.vn","variations":[50709,50708,50707,50706,50705,50704,50703,50702,50701,50700]},{"id":50683,"name":".dienbien.vn","variations":[50694,50693,50692,50691,50690,50689,50688,50687,50686,50685]},{"id":50658,"name":".danang.vn","variations":[50678,50677,50676,50675,50674,50673,50672,50671,50670,50669]},{"id":50631,"name":".daklak.vn","variations":[50645,50644,50643,50642,50641,50640,50639,50638,50637,50636]},{"id":50616,"name":".caobang.vn","variations":[50628,50627,50626,50625,50624,50623,50622,50621,50620,50619]},{"id":50593,"name":".cantho.vn","variations":[50605,50604,50603,50602,50601,50600,50599,50598,50597,50596]},{"id":50579,"name":".camau.vn","variations":[50590,50589,50588,50587,50586,50585,50584,50583,50582,50581]},{"id":50536,"name":".bacninh.vn","variations":[50568,50567,50566,50565,50564,50563,50562,50561,50560,50559]},{"id":50501,"name":".angiang.vn","variations":[50528,50527,50526,50525,50524,50523,50522,50521,50520,50517]},{"id":50419,"name":".hanoi.vn","variations":[50430,50429,50428,50427,50426,50425,50424,50423,50422,50421]},{"id":1331,"name":"Tên miền .id.vn","variations":[46630,46629,46628,46627,46626,46625,46624,46623,46622,46621]},{"id":1328,"name":"Tên miền .name.vn","variations":[51802,51801,51800,51799,51798,51797,51796,51795,51794,51793]}];
          const host='https://admin.esc.vn';
          const env=process.env;
          assert.equal(new URL(env.WP_ADMIN_URL.includes('://')?env.WP_ADMIN_URL:'https://'+env.WP_ADMIN_URL).origin,host);
          const cfg=Object.fromEntries(env.ENV_FILE.split('\n').filter(x=>x.includes('=')).map(x=>{const i=x.indexOf('=');return [x.slice(0,i).trim(),x.slice(i+1).trim().replace(/^["']|["']$/g,'')]}));
          assert.equal(cfg.WC_URL.replace(/\/$/,''),host);
          const auth='Basic '+Buffer.from(cfg.WOO_KEY+':'+cfg.WOO_SECRET).toString('base64');
          const fields='id,name,type,status,price,regular_price,sale_price,tax_status,tax_class,categories,variations';
          const vf='id,status,price,regular_price,sale_price,tax_status,tax_class,attributes';
          const get=async(path,params={})=>{
            const res=await fetch(host+'/wp-json/wc/v3/'+path+'?'+new URLSearchParams(params),{headers:{Authorization:auth,Accept:'application/json'},signal:AbortSignal.timeout(45000)});
            assert.equal(res.status,200,'Read '+path+' HTTP '+res.status);
            return res.json();
          };
          const snap=async(m)=>{
            const [p,v]=await Promise.all([get('products/'+m.id,{_fields:fields}),get('products/'+m.id+'/variations',{per_page:100,_fields:vf})]);
            assert.equal(p.id,m.id);assert.equal(p.name,m.name);assert.equal(p.type,'variable');assert.equal(p.status,'publish');
            assert.ok(p.categories.some(c=>c.id===175));assert.deepEqual([...p.variations].sort((a,b)=>a-b),[...m.variations].sort((a,b)=>a-b));
            assert.deepEqual(v.map(x=>x.id).sort((a,b)=>a-b),[...m.variations].sort((a,b)=>a-b));
            assert.ok(['none','taxable'].includes(p.tax_status));assert.equal(p.tax_class,'');
            assert.ok(v.every(x=>x.tax_status===p.tax_status&&x.tax_class===''));
            return {p,v:v.sort((a,b)=>a.id-b.id)};
          };
          const controls=()=>Promise.all([997,998,999,1000,867,868].map(id=>get('products/'+id,{_fields:fields})));
          async function limited(list,fn,n=5){const out=[];for(let i=0;i<list.length;i+=n)out.push(...await Promise.all(list.slice(i,i+n).map(fn)));return out;}
          const strip=o=>Object.fromEntries(Object.entries(o).filter(([k])=>k!=='tax_status'));
          const verify=(old,now)=>{
            assert.equal(now.p.tax_status,'none');
            assert.ok(now.v.every(v=>v.tax_status==='none'));
            assert.deepEqual(strip(now.p),strip(old.p));
            assert.deepEqual(now.v.map(strip),old.v.map(strip));
          };
          assert.equal(manifest.length,36);assert.equal(manifest.reduce((s,m)=>s+m.variations.length,0),360);
          const controlBefore=await controls();
          const before=await limited(manifest,snap);
          mkdirSync('tax-audit',{recursive:true});
          writeFileSync('tax-audit/before.json',JSON.stringify(before,null,2));
          console.log('PREFLIGHT_PASS parents=36 variations=360');
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext();
          const page=await context.newPage();
          let changed=0,skipped=0,verified=0,errors=0;
          try{
            await page.goto(host+'/wp-admin/',{waitUntil:'domcontentloaded',timeout:60000});
            if(await page.locator('#user_login').isVisible().catch(()=>false)){
              await page.locator('#user_login').fill(env.WP_ADMIN_USERNAME);
              await page.locator('#user_pass').fill(env.WP_ADMIN_PASSWORD);
              const text=await page.locator('body').innerText();
              const m=text.match(/(\d+)\s*([+\-x×*])\s*(\d+)\s*(?:=|\?)/i);
              if(m){
                const val=m[2]==='+'?+m[1]+ +m[3]:m[2]==='-'?+m[1]- +m[3]:+m[1]* +m[3];
                const captcha=page.locator('#loginform input[name*="captcha" i], #loginform input[id*="captcha" i], #loginform input[name*="math" i], #loginform input[type="number"]').first();
                assert.ok(await captcha.count(),'Unsupported CAPTCHA');await captcha.fill(String(val));
              }
              await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:60000}),page.locator('#wp-submit').click()]);
            }
            assert.ok(page.url().startsWith(host+'/wp-admin/')&&!page.url().includes('wp-login.php'),'Admin login failed');
            const nonce=await page.evaluate(async()=>{const r=await fetch('/wp-admin/admin-ajax.php?action=rest-nonce',{cache:'no-store'});return (await r.text()).trim();});
            assert.match(nonce,/^[a-f0-9]{10}$/);
            let mode='REST';
            const update=async(m,old)=>{
              const current=await get('products/'+m.id,{_fields:fields});
              assert.deepEqual(current,old.p,'Concurrent change '+m.id);
              if(current.tax_status==='none'){skipped++;return;}
              if(mode==='REST'){
                const result=await page.evaluate(async({id,nonce})=>{
                  const r=await fetch('/wp-json/wc/v3/products/'+id,{method:'PUT',credentials:'same-origin',headers:{'X-WP-Nonce':nonce,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({tax_status:'none'})});
                  const b=await r.json().catch(()=>({}));return {status:r.status,id:b.id,tax:b.tax_status,code:b.code};
                },{id:m.id,nonce});
                if(result.status===401||result.status===403){console.log('COOKIE_REST_UNAVAILABLE',result.status,result.code||'');mode='ADMIN_FORM';}
                else{assert.equal(result.status,200,'REST write '+m.id+' '+result.status+' '+result.code);assert.equal(result.id,m.id);assert.equal(result.tax,'none');changed++;return;}
              }
              await page.goto(host+'/wp-admin/post.php?post='+m.id+'&action=edit',{waitUntil:'domcontentloaded',timeout:60000});
              assert.equal(await page.locator('#post_ID').inputValue(),String(m.id));
              const tax=page.locator('select#_tax_status');
              assert.equal(await tax.count(),1,'Tax status control missing');
              assert.equal(await tax.inputValue(),'taxable');
              // Select the sole approved changed field and use the native WP edit form.
              await page.locator('.product_data_tabs li.general_tab a').click().catch(()=>{});
              await tax.selectOption('none',{force:true});
              await Promise.all([page.waitForNavigation({waitUntil:'domcontentloaded',timeout:90000}),page.locator('#publish').click()]);
              assert.equal(await page.locator('#post_ID').inputValue(),String(m.id));
              assert.equal(await page.locator('select#_tax_status').inputValue(),'none','Admin form did not persist tax status');
              changed++;
            };
            for(let i=0;i<manifest.length;i++){
              const m=manifest[i],old=before[i];
              await update(m,old);
              const now=await snap(m);verify(old,now);verified++;
              console.log('VERIFIED',m.id,m.name,'variations=10','mode='+mode);
            }
            const after=await limited(manifest,snap);
            after.forEach((s,i)=>verify(before[i],s));
            assert.deepEqual(await controls(),controlBefore,'Control products changed');
            writeFileSync('tax-audit/after.json',JSON.stringify(after,null,2));
            console.log('READBACK_PASS parents=36 variations=360 controls=6');
          }catch(e){errors++;throw e;}
          finally{console.log('WRITE_SUMMARY',JSON.stringify({changed,skipped_unchanged:skipped,verified,errors,temporary_created:0,cleanup_remaining:0}));await browser.close();}
          JS
          node --check tax-apply.mjs
          node tax-apply.mjs
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vn-domain-tax-audit
          path: tax-audit/
          if-no-files-found: warn
          retention-days: 14
