name: Audit ESC Vietnam domain tax scope
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/wordpress-vn-domain-tax-audit.yml']
permissions:
  contents: read
concurrency:
  group: esc-vn-domain-tax-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inventory live products and variations read-only
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request,urllib.parse,concurrent.futures,re,unicodedata
          cfg={}
          for line in os.environ['ENV_FILE'].splitlines():
              k,sep,v=line.partition('=')
              if sep: cfg[k.strip()]=v.strip().strip(chr(34)+chr(39))
          origin=cfg['WC_URL'].rstrip('/')
          assert origin=='https://admin.esc.vn'
          assert cfg.get('WOO_KEY') and cfg.get('WOO_SECRET')
          auth='Basic '+base64.b64encode((cfg['WOO_KEY']+':'+cfg['WOO_SECRET']).encode()).decode()
          def get(path,params=None):
              url=origin+'/wp-json/wc/v3/'+path+('?' + urllib.parse.urlencode(params) if params else '')
              req=urllib.request.Request(url,headers={'Authorization':auth,'Accept':'application/json','User-Agent':'ESC-Tax-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  return json.loads(r.read()),int(r.headers.get('X-WP-TotalPages','1'))
          def all_pages(path,params=None):
              p=dict(params or {},per_page=100,page=1)
              data,n=get(path,p)
              assert isinstance(data,list)
              for i in range(2,n+1):
                  batch,_=get(path,dict(p,page=i))
                  data.extend(batch)
              return data
          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFD',str(s).lower().replace('đ','d')) if unicodedata.category(c)!='Mn')
          cats=all_pages('products/categories',{'hide_empty':'false','_fields':'id,name,slug,parent,count'})
          print('CATEGORIES',json.dumps(cats,ensure_ascii=False))
          classes,_=get('taxes/classes')
          rates=all_pages('taxes')
          print('TAX_CLASSES',json.dumps(classes,ensure_ascii=False))
          print('TAX_RATES',json.dumps([{k:r.get(k) for k in ['id','class','rate','country','state','name','priority','compound','shipping']} for r in rates],ensure_ascii=False))
          try:
              settings,_=get('settings/tax')
              print('TAX_SETTINGS',json.dumps([{k:x.get(k) for k in ['id','value']} for x in settings if x.get('id') in ['woocommerce_prices_include_tax','woocommerce_tax_based_on','woocommerce_tax_display_cart','woocommerce_tax_display_shop','woocommerce_tax_round_at_subtotal']],ensure_ascii=False))
          except Exception as e: print('TAX_SETTINGS_UNAVAILABLE',type(e).__name__)
          fields='id,name,slug,type,status,sku,price,regular_price,sale_price,tax_status,tax_class,categories,variations,attributes'
          products=all_pages('products',{'_fields':fields})
          print('CATALOG_COUNT',len(products))
          domain_cats={c['id'] for c in cats if re.search(r'ten mien|ten-mien|domain',norm(c['name']+' '+c['slug']))}
          while True:
              expanded=domain_cats|{c['id'] for c in cats if c['parent'] in domain_cats}
              if expanded==domain_cats: break
              domain_cats=expanded
          def candidate(p):
              t=norm(' '.join(str(p.get(k,'')) for k in ['name','slug','sku']))
              return bool(domain_cats & {c['id'] for c in p.get('categories',[])}) or bool(re.search(r'ten mien|ten-mien|domain|\.vn\b|(?:^|[-_])vn(?:$|[-_])',t))
          selected=[p for p in products if candidate(p)]
          print('DOMAIN_CANDIDATE_COUNT',len(selected))
          def variations(p):
              if p['type']!='variable': return []
              data=all_pages('products/'+str(p['id'])+'/variations',{'_fields':'id,sku,status,price,regular_price,sale_price,tax_status,tax_class,attributes'})
              assert set(p.get('variations',[])) <= {v['id'] for v in data}, 'Missing variations for '+str(p['id'])
              return data
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              for p,vs in zip(selected,pool.map(variations,selected)):
                  row={k:p.get(k) for k in ['id','name','slug','type','status','sku','price','tax_status','tax_class','categories']}
                  row['variations']=[{k:v.get(k) for k in ['id','status','sku','price','tax_status','tax_class','attributes']} for v in vs]
                  print('DOMAIN_ROW',json.dumps(row,ensure_ascii=False,separators=(',',':')))
          for p in products:
              if p['id'] in [867,868]:
                  print('CONTROL',json.dumps({k:p.get(k) for k in ['id','name','tax_status','tax_class','categories']},ensure_ascii=False))
          print('AUDIT_READ_ONLY_PASS')
          PY
