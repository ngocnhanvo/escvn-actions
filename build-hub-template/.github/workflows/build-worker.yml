name: ESC Private Hub Windows Worker (no FTP)
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      repository:
        type: string
        required: true
      cache_mode:
        type: string
        required: true
    secrets:
      source_token:
        required: true
      env_file:
        required: true
permissions:
  contents: read
jobs:
  worker:
    name: VPS ${{ inputs.project }}
    runs-on: [self-hosted, Windows, X64, esc-build-pool]
    timeout-minutes: 70
    steps:
      - name: Ensure modern Git before checkout (Windows Server 2016)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # actions/checkout falls back to ZIP extraction when git.exe is absent.
          # That fallback is unreliable with the older PowerShell on Windows Server 2016.
          $git = Get-Command git.exe -ErrorAction SilentlyContinue
          $gitPath = if ($git) { $git.Source } else { $null }
          if (-not $gitPath) {
            foreach ($candidate in @(
              "$env:ProgramFiles\Git\cmd\git.exe",
              "$env:ProgramFiles\Git\bin\git.exe"
            )) {
              if (Test-Path $candidate) {
                $gitPath = $candidate
                break
              }
            }
          }

          $usable = $false
          if ($gitPath) {
            try {
              $versionText = (& $gitPath --version 2>&1 | Out-String)
              $match = [regex]::Match($versionText, '(\d+)\.(\d+)\.(\d+)')
              if ($match.Success -and [version]$match.Value -ge [version]'2.18.0') {
                $usable = $true
                $gitDir = Split-Path $gitPath -Parent
              }
            }
            catch {
              Write-Host 'Existing Git is not usable. Trying pinned MinGit instead.'
            }
          }

          if (-not $usable) {
            $version = '2.56.0.2'
            $url = 'https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip'
            # SHA-256 published by the Git for Windows GitHub release.
            $expected = 'da35e72aa21c005a5a0d298cfbae110bc1609a815730ea0dde84b01a1b3cd3be'
            $root = Join-Path (Split-Path $env:RUNNER_TEMP -Parent) 'esc-build-tools'
            $destination = Join-Path $root "MinGit-$version"
            $gitDir = Join-Path $destination 'cmd'
            $gitExe = Join-Path $gitDir 'git.exe'
            if (-not (Test-Path $gitExe)) {
              New-Item -ItemType Directory -Path $root -Force | Out-Null
              $archive = Join-Path $env:RUNNER_TEMP "MinGit-$version.zip"
              Write-Host 'Downloading verified MinGit for the isolated runner.'
              Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
              $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) {
                Remove-Item $archive -Force -ErrorAction SilentlyContinue
                throw 'MinGit SHA-256 mismatch. Refusing to execute the downloaded file.'
              }
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              if (Test-Path $destination) {
                Remove-Item $destination -Recurse -Force
              }
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              [System.IO.Compression.ZipFile]::ExtractToDirectory($archive, $destination)
              Remove-Item $archive -Force
            }
          }

          if (-not (Test-Path (Join-Path $gitDir 'git.exe'))) {
            throw 'Git binary missing after bootstrap.'
          }
          # Make Git discoverable by this step AND all subsequent GitHub Actions.
          $env:PATH = "$gitDir;$env:PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $gitDir -Encoding Ascii
          $versionText = (& (Join-Path $gitDir 'git.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Git failed after bootstrap.' }
          Write-Host "Ready for actions/checkout: $versionText"
      - name: Checkout private Hub controls
        uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
          clean: true
      - name: Checkout approved project production source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: master
          token: ${{ secrets.source_token }}
          path: source
          persist-credentials: false
          clean: true
      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Windows worker script before building
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $t = $null
          $e = $null
          $file=Join-Path $env:GITHUB_WORKSPACE 'control/scripts/run-project-build.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$t,[ref]$e)|Out-Null
          if($e -and $e.Count){throw "Build worker PowerShell parse errors: $($e.Count)"}
          & node --check .\control\scripts\persistent-deps.mjs
          if($LASTEXITCODE -ne 0){throw 'Node dependency-manager syntax check failed'}
      - name: Build only with persistent modules (NEVER FTP)
        shell: powershell
        env:
          HUB_ENV_FILE: ${{ secrets.env_file }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\control\scripts\run-project-build.ps1 -Project '${{ inputs.project }}' -CheckoutRoot (Join-Path $env:GITHUB_WORKSPACE 'source') -BasePath 'C:\ESC-Build' -CacheMode '${{ inputs.cache_mode }}'
      - name: Upload sanitized build metrics only (not dist/.env)
        uses: actions/upload-artifact@v4
        with:
          name: build-result-${{ inputs.project }}
          path: build-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Clean any temporary environment copies
        if: always()
        shell: powershell
        run: |
          Remove-Item 'source\.env' -Force -ErrorAction SilentlyContinue
          Remove-Item 'control\.env' -Force -ErrorAction SilentlyContinue
